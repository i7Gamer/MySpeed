<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8"/>
    <meta name="viewport" content="width=device-width"/>
    <title>MySpeed [Dev Mode]</title>
    <style type="text/css">
        body, html {
            font-family: sans-serif;
            color: #FEFEFE;
            background-color: #232835;
            padding: 0;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            gap: 1rem;
        }

        .logo {
            display: flex;
            gap: 1rem;
            align-items: center;
            user-select: none;
        }

        .logo span {
            color: #3EA95A;
        }

        code {
            background-color: #1d2128;
            padding: 0.5rem;
            border-radius: 0.4rem;
        }

        p {
            margin: 0.5rem;
            font-size: 16pt;
        }

        a {
            background-color: #3EA95A;
            border-radius: 0.4rem;
            padding: 0.5rem 1rem;
            color: #1d2128;
            font-weight: bold;
            font-size: 13pt;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }

        a:hover {
            transform: rotate(-1deg);
        }

        a:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="logo">
    <h1>MySpeed <span>Dev Mode</span></h1>
</div>

<div class="explanation">
    <p>Your MySpeed instance is currently in development mode.</p>
    <p>Please build the client or use a production binary,</p>
    <p>if this is a production environment or go to the development</p>
    <p>environment.</p>
</div>

<!-- Shown unconditionally. This used to be a button revealed by a script that
     probed the dev server first, but the page is served with the app's own CSP:
     the script, the onclick and the probe were all blocked, so the button never
     appeared. A plain link needs none of the three - CSP does not restrict
     top-level navigation. -->
<a href="http://localhost:5173">Go to development environment</a>

</body>
</html>
