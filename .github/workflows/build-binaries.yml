name: Build Binaries

# Every job checks out v<version> rather than the dispatched ref. create-release
# pushes the version bump and then cuts the tag at that commit, so the tag is the
# only ref where package.json already carries the version being released - and
# that value is compiled into the binaries by server/routes/system.js.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_id:
        required: true
        type: string

jobs:
  build-windows:
    name: "Windows (${{ matrix.label }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default Bun x64 target needs AVX2, same as on Linux. Older CPUs
          # (e.g. Bay Trail Celeron) die with "Illegal instruction" at startup -
          # and the MSI registers this binary as a service, where that crash
          # surfaces as a service that never starts rather than as an error.
          - label: x64
            target: bun-windows-x64
            artifact_name: MySpeed-windows-x64.exe
          - label: x64-baseline
            target: bun-windows-x64-baseline
            artifact_name: MySpeed-windows-x64-baseline.exe

    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: Move-Item -Path client/build -Destination .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      # Retried, because the baseline leg fetches a runtime mid-compile and that
      # fetch has failed this runner twice: "Failed to extract executable for
      # 'bun-windows-x64-baseline-v1.3.14'. The download may be incomplete.",
      # after bundling cleanly. The default leg never sees it - the runner's own
      # Bun is windows-x64, so there is nothing to download - and the same
      # target compiled on a cold cache off CI, which is what points at the
      # fetch rather than at the target.
      #
      # Worth the loop rather than a re-dispatch: build-binaries failing is one
      # of the two conditions that tear the tag and the draft release down, and
      # Docker Hub has already been pushed by the time it does.
      #
      # The cached runtime goes between attempts. Bun keeps it at
      # ~/.bun/install/cache/<target>-v<version>, and a truncated file there is
      # precisely what the message reports - left in place, every retry reads it
      # back and fails the same way.
      - name: Compile binary
        shell: pwsh
        run: |
          $attempts = 3

          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} server/index.js --outfile MySpeed.exe

            if ($LASTEXITCODE -eq 0) { exit 0 }

            Write-Host "::warning::compile attempt $attempt of $attempts failed (exit $LASTEXITCODE)"

            if ($attempt -lt $attempts) {
              Remove-Item "$HOME/.bun/install/cache/${{ matrix.target }}-v*" -Recurse -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 15
            }
          }

          Write-Host "::error::the binary never compiled in $attempts attempts"
          exit 1

      # A green compile says nothing about whether the binary runs, which is the
      # whole premise of the baseline leg. Before the upload, so a binary that
      # never boots fails the release rather than being attached to it.
      #
      # The runner has AVX2, so for the baseline leg this proves the binary is
      # not broken - not that it fixes a machine without AVX2. That part is what
      # the emulator run and a hardware report are for.
      - name: Verify binary boots and serves
        shell: pwsh
        run: ./scripts/verify-binary.ps1 -Binary ./MySpeed.exe

      - name: Upload to Release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_NAME: ${{ matrix.artifact_name }}
          ASSET_PATH: MySpeed.exe
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID, 10),
              name: process.env.ASSET_NAME,
              data: fs.readFileSync(process.env.ASSET_PATH)
            });

      # Both legs compile to MySpeed.exe - build-msi's WiX source resolves
      # against that name - so the matrix value is all that keeps the two
      # variants apart once they leave the job.
      - name: Upload artifact for MSI
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: MySpeed.exe

  build-linux:
    name: "Linux (${{ matrix.label }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default Bun x64 target needs AVX2. Older CPUs (e.g. Bay Trail
          # Celeron) SIGILL on startup — ship a baseline build for them.
          - label: x64
            target: bun-linux-x64
            runner: ubuntu-latest
            artifact_name: MySpeed-linux-x64
          - label: x64-baseline
            target: bun-linux-x64-baseline
            runner: ubuntu-latest
            artifact_name: MySpeed-linux-x64-baseline
          - label: arm64
            target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            artifact_name: MySpeed-linux-arm64

    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: mv client/build .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      - name: Compile binary
        run: bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} server/index.js --outfile MySpeed

      - name: Rename binary
        run: mv MySpeed ${{ matrix.artifact_name }}

      - name: Upload to Release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_NAME: ${{ matrix.artifact_name }}
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID, 10),
              name: process.env.ASSET_NAME,
              data: fs.readFileSync(process.env.ASSET_NAME)
            });

  build-macos:
    name: "macOS (${{ matrix.arch }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: bun-darwin-x64
            artifact_name: MySpeed-macos-x64
          - arch: arm64
            target: bun-darwin-arm64
            artifact_name: MySpeed-macos-arm64

    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: mv client/build .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      - name: Compile binary
        run: bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} server/index.js --outfile MySpeed

      - name: Rename binary
        run: mv MySpeed ${{ matrix.artifact_name }}

      - name: Upload to Release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_NAME: ${{ matrix.artifact_name }}
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID, 10),
              name: process.env.ASSET_NAME,
              data: fs.readFileSync(process.env.ASSET_NAME)
            });

  build-zip:
    name: "Source ZIP"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: mv client/build .

      - name: Install server dependencies
        run: bun install

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Create zip archive
        run: zip -r MySpeed.zip build server package.json

      - name: Upload to Release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_NAME: MySpeed.zip
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID, 10),
              name: process.env.ASSET_NAME,
              data: fs.readFileSync(process.env.ASSET_NAME)
            });
