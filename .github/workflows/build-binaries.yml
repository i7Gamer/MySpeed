name: Build Binaries

# Every job checks out v<version> rather than the dispatched ref. create-release
# pushes the version bump and then cuts the tag at that commit, so the tag is the
# only ref where package.json already carries the version being released - and
# that value is compiled into the binaries by server/routes/system.js.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_id:
        required: true
        type: string
    outputs:
      duplicate-digests:
        description: "Unexpected assets that share one SHA-256 digest, or empty"
        value: ${{ jobs.checksums.outputs.duplicate-digests }}

# Dependency scripts and compiled artifacts execute only with repository read access.
permissions:
  contents: read

jobs:
  build-windows:
    name: "Windows (${{ matrix.label }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bun 1.4.2's default and baseline target names both use the unified
          # Nehalem/SSE4.2 runtime and dispatch newer AVX instructions at run
          # time. Keep both names for existing direct-download and MSI URLs.
          - label: x64
            target: bun-windows-x64
            artifact_name: MySpeed-windows-x64.exe
          - label: x64-baseline
            target: bun-windows-x64-baseline
            artifact_name: MySpeed-windows-x64-baseline.exe

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to the unified-baseline runtime qualified for this release.
          bun-version: 1.4.2

      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: bun scripts/move-client-build.js

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      # Asked to compile for a target it is not, Bun fetches that runtime itself
      # - and on windows-latest that fetch does not work. Three releases died on
      # "Failed to extract executable for 'bun-windows-x64-baseline-v1.3.14'.
      # The download may be incomplete.", about 0.6s after bundling cleanly,
      # each deleting its own tag and draft while Docker had already been pushed.
      #
      # The message names a download and none of it holds. Diagnosed on the
      # runner: Defender's real-time protection is off there and an exclusion
      # changed nothing, curl pulled the same artifact in a second (38,023,440
      # bytes) and Expand-Archive unpacked it, and Bun's cache was empty
      # afterwards - nothing partial was ever written. Retrying three times with
      # the cache cleared in between failed three times.
      #
      # Compiling with the baseline Bun itself worked first try. That is also
      # why the default leg has never failed: the runner's Bun is windows-x64,
      # so it has nothing to fetch. Giving each leg a Bun that is its own target
      # puts the working leg's condition under the broken one.
      #
      # Bun's release archives are named for these same targets, so the asset is
      # the matrix value with .zip after it. setup-bun above still installs the
      # host Bun that runs bun install and the client build.
      - name: Fetch a Bun matching the target
        shell: pwsh
        run: |
          $version = bun --version
          $url = "https://github.com/oven-sh/bun/releases/download/bun-v$version/${{ matrix.target }}.zip"
          Write-Host "fetching $url"

          curl.exe -sSL --retry 3 --fail -o target-bun.zip $url
          if ($LASTEXITCODE -ne 0) { throw "could not download $url (curl exit $LASTEXITCODE)" }

          Expand-Archive target-bun.zip -DestinationPath target-bun -Force

          $exe = (Get-ChildItem target-bun -Recurse -Filter bun.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "no bun.exe inside $url" }

          & $exe --version
          "TARGET_BUN=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # --windows-version stamps the exe's version resource with MySpeed's own
      # version, four parts so the run number makes every build strictly newer
      # than the one before it. Without it the resource is Bun's: v1.5.2's exe
      # carried 1.4.0.0 and v1.5.3's 1.3.14.0, from the Bun each was compiled
      # with, and Windows Installer keeps a file whose version on disk is higher
      # - then the major upgrade removed the old product and that file with it,
      # so the service was started into a missing MySpeed.exe, the installer
      # waited out its restart loop and rolled back. The same rule refuses an
      # equal version, which is what a rebuild of one release used to publish.
      - name: Compile binary
        shell: pwsh
        env:
          # Through env, never spliced into the script: the version is a
          # dispatch input, the classic injection carrier.
          RELEASE_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          & "$env:TARGET_BUN" build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} --windows-version="${env:RELEASE_VERSION}.${env:RUN_NUMBER}" server/index.js --outfile MySpeed.exe
          if ($LASTEXITCODE -ne 0) { throw "the binary did not compile (exit $LASTEXITCODE)" }

      # A green compile says nothing about whether the binary runs, which is the
      # whole premise of the baseline leg. Before the upload, so a binary that
      # never boots fails the release rather than being attached to it.
      #
      # The runner has AVX2, so for the baseline leg this proves the binary is
      # not broken - not that it fixes a machine without AVX2. That part is what
      # the emulator run and a hardware report are for.
      - name: Verify binary boots and serves
        shell: pwsh
        run: ./scripts/verify-binary.ps1 -Binary ./MySpeed.exe


      # Both legs compile to MySpeed.exe - build-msi's WiX source resolves
      # against that name - so the matrix value is all that keeps the two
      # variants apart once they leave the job.
      - name: Hash verified binary
        shell: bash
        env:
          ASSET_PATH: MySpeed.exe
        run: |
          bun -e 'const fs = require("fs"); const {createHash} = require("crypto"); const file = process.env.ASSET_PATH; fs.writeFileSync(file + ".sha256", createHash("sha256").update(fs.readFileSync(file)).digest("hex") + "\n");'

      - name: Upload artifact for MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            MySpeed.exe
            MySpeed.exe.sha256
          if-no-files-found: error

  build-linux:
    name: "Linux (${{ matrix.label }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bun 1.4.2's default and baseline x64 names both select its unified
          # Nehalem/SSE4.2 runtime, which dispatches AVX2/AVX-512 paths at run
          # time. Both artifact names remain for compatibility with old URLs.
          # `verify` says per leg whether the compiled binary is booted before it
          # is uploaded. Both x64 legs are, because install.sh picks between them
          # automatically on the user's behalf - and the baseline one is chosen
          # silently, on exactly the CPUs whose owner is least placed to debug a
          # binary that will not start. arm64 is not: pwsh, which
          # verify-binary.ps1 needs, is not on the arm runner image.
          - label: x64
            target: bun-linux-x64
            runner: ubuntu-latest
            artifact_name: MySpeed-linux-x64
            verify: true
          - label: x64-baseline
            target: bun-linux-x64-baseline
            runner: ubuntu-latest
            artifact_name: MySpeed-linux-x64-baseline
            verify: true
          - label: arm64
            target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            artifact_name: MySpeed-linux-arm64
            verify: false

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to the unified-baseline runtime qualified for this release.
          bun-version: 1.4.2

      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: bun scripts/move-client-build.js

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      - name: Compile binary
        run: bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} server/index.js --outfile MySpeed

      - name: Rename binary
        run: mv MySpeed ${{ matrix.artifact_name }}

      # The same gate the Windows job carries, for the same reason: a green
      # compile says nothing about whether the binary runs, and the crash this
      # matrix exists for happens at startup long after the compiler is happy.
      # Before the upload, so a binary that never boots fails the release rather
      # than being attached to it.
      #
      # The runner has AVX2, so for the baseline leg this proves the binary is
      # not broken - not that it fixes a machine without AVX2.
      - name: Verify binary boots and serves
        if: ${{ matrix.verify }}
        shell: pwsh
        run: ./scripts/verify-binary.ps1 -Binary ./${{ matrix.artifact_name }}

      # Execute the actual candidate under the oldest x64 CPU contract Bun 1.4
      # supports. The reset command loads the compiled application and opens its
      # SQLite database, but returns before starting listeners, schedulers or
      # providers. Empty current server lists stop top-level discovery, and the
      # network namespace makes that isolation a gate rather than an assumption.
      - name: Verify x64 binary on Nehalem CPU
        if: ${{ startsWith(matrix.target, 'bun-linux-x64') }}
        shell: bash
        env:
          CPU_PROBE_TIMEOUT_SECONDS: 60
          RESET_NOTHING_TO_DO_EXIT: 113
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user

          artifact="$(realpath "./${{ matrix.artifact_name }}")"
          probe_work="$(mktemp -d)"
          trap 'sudo rm -rf -- "$probe_work"' EXIT
          mkdir -p "$probe_work/data/servers"
          printf '{}\n' > "$probe_work/data/servers/ookla.json"
          printf '{}\n' > "$probe_work/data/servers/librespeed.json"

          set +e
          (
            cd "$probe_work"
            timeout "${CPU_PROBE_TIMEOUT_SECONDS}s" sudo unshare --net -- \
              /usr/bin/qemu-x86_64 -cpu Nehalem "$artifact" --reset-password
          )
          probe_status=$?
          set -e

          if [ "$probe_status" -ne "$RESET_NOTHING_TO_DO_EXIT" ]; then
            echo "::error::Nehalem CPU probe exited $probe_status, expected $RESET_NOTHING_TO_DO_EXIT."
            exit 1
          fi

      - name: Hash verified binary
        shell: bash
        env:
          ASSET_PATH: ${{ matrix.artifact_name }}
        run: |
          bun -e 'const fs = require("fs"); const {createHash} = require("crypto"); const file = process.env.ASSET_PATH; fs.writeFileSync(file + ".sha256", createHash("sha256").update(fs.readFileSync(file)).digest("hex") + "\n");'

      - name: Upload verified build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          if-no-files-found: error

  build-macos:
    name: "macOS (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A runner per architecture, as the Linux matrix already does, because
          # this is the one job that was building both targets on one host - and
          # the host is what decides which native addons exist.
          #
          # @resvg/resvg-js resolves a platform-specific .node at require time,
          # and its bindings are optionalDependencies keyed by os/cpu (see
          # bun.lock). An install on an arm64 runner fetches darwin-arm64 and
          # skips darwin-x64, so the x64 binary was cross-compiled against a
          # binding that was never on disk. server/controller/opengraph.js no
          # longer imports it at boot, so that is now a broken preview image
          # rather than a server that will not start - but building each target
          # where its own bindings install is the actual fix, and it is what
          # makes the leg verifiable at all: a binary can only be booted on the
          # architecture it was built for.
          - arch: x64
            target: bun-darwin-x64
            runner: macos-15-intel
            artifact_name: MySpeed-macos-x64
            verify: true
          - arch: arm64
            target: bun-darwin-arm64
            runner: macos-latest
            artifact_name: MySpeed-macos-arm64
            verify: true

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to the unified-baseline runtime qualified for this release.
          bun-version: 1.4.2

      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: bun scripts/move-client-build.js

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      - name: Compile binary
        run: bun build --compile --compile-autoload-package-json --external pg-hstore --external pg --target=${{ matrix.target }} server/index.js --outfile MySpeed

      - name: Rename binary
        run: mv MySpeed ${{ matrix.artifact_name }}

      # macOS was the only platform shipping a binary nobody had started. Windows
      # and Linux both boot theirs before the upload; this job went compile ->
      # rename -> release, so any fault that shows at startup rather than at
      # compile time - a missing native binding above all - reached users first.
      - name: Verify binary boots and serves
        if: ${{ matrix.verify }}
        shell: pwsh
        run: ./scripts/verify-binary.ps1 -Binary ./${{ matrix.artifact_name }}

      - name: Hash verified binary
        shell: bash
        env:
          ASSET_PATH: ${{ matrix.artifact_name }}
        run: |
          bun -e 'const fs = require("fs"); const {createHash} = require("crypto"); const file = process.env.ASSET_PATH; fs.writeFileSync(file + ".sha256", createHash("sha256").update(fs.readFileSync(file)).digest("hex") + "\n");'

      - name: Upload verified build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          if-no-files-found: error

  build-zip:
    name: "Source ZIP"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Source users need this same minimum runtime for the tested dependency set.
          bun-version: 1.4.2

      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: bun scripts/move-client-build.js

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Create zip archive
        # bun.lock too: the archive requires Bun 1.4.2 or newer, and
        # without the lockfile `bun install` re-resolves every range - two people
        # unpacking one release get different builds of express and sequelize,
        # neither of them the one that was tested.
        run: zip -r MySpeed.zip build server package.json bun.lock

      - name: Hash source archive
        shell: bash
        env:
          ASSET_PATH: MySpeed.zip
        run: |
          bun -e 'const fs = require("fs"); const {createHash} = require("crypto"); const file = process.env.ASSET_PATH; fs.writeFileSync(file + ".sha256", createHash("sha256").update(fs.readFileSync(file)).digest("hex") + "\n");'

      - name: Upload verified build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MySpeed.zip
          path: |
            MySpeed.zip
            MySpeed.zip.sha256
          if-no-files-found: error

  # A fresh runner uploads bytes without executing repository or artifact code.
  publish-binaries:
    name: "Publish verified binaries"
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos, build-zip]
    permissions:
      contents: write
    steps:
      - name: Download verified builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: MySpeed*
          path: artifacts

      - name: Upload to Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const assets = [
              // Every payload is checked against its build-side SHA256 below.
              ['MySpeed-windows-x64.exe', 'MySpeed.exe'],
              ['MySpeed-windows-x64-baseline.exe', 'MySpeed.exe'],
              ['MySpeed-linux-x64', 'MySpeed-linux-x64'],
              ['MySpeed-linux-x64-baseline', 'MySpeed-linux-x64-baseline'],
              ['MySpeed-linux-arm64', 'MySpeed-linux-arm64'],
              ['MySpeed-macos-x64', 'MySpeed-macos-x64'],
              ['MySpeed-macos-arm64', 'MySpeed-macos-arm64'],
              ['MySpeed.zip', 'MySpeed.zip']
            ];
            // Validate the complete handoff before the first upload.
            const {createHash} = require('crypto');
            for (const [name, file] of assets) {
              const path = `artifacts/${name}/${file}`;
              if (!fs.lstatSync(path).isFile() || fs.statSync(path).size === 0)
                throw new Error(`Missing or empty release asset: ${name}`);
              const expected = fs.readFileSync(path + '.sha256', 'utf8').trim();
              const actual = createHash('sha256').update(fs.readFileSync(path)).digest('hex');
              if (actual !== expected) throw new Error('SHA256 digest mismatch: ' + name);
            }
            for (const [name, file] of assets) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: Number(process.env.RELEASE_ID),
                name,
                data: fs.readFileSync(`artifacts/${name}/${file}`)
              });
            }

  # Last, and needing every job that uploads an asset: it hashes what the
  # release actually carries rather than what a build thought it produced.
  checksums:
    name: "Install scripts and checksums"
    runs-on: ubuntu-latest
    needs: [publish-binaries]
    permissions:
      contents: write
    outputs:
      duplicate-digests: ${{ steps.sha256sums.outputs.duplicate-digests }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: v${{ inputs.version }}

      # The documented install command fetches these. Served from the release
      # rather than from a branch, so what a new installer runs is a version
      # that was cut, not whatever the working branch holds this hour.
      - name: Upload the install scripts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const fs = require('fs');

            for (const name of ['install.sh', 'docker-install.sh', 'chooser.sh']) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: parseInt(process.env.RELEASE_ID, 10),
                name,
                data: fs.readFileSync(`scripts/${name}`)
              });
            }

      # What a download is supposed to be.
      #
      # install.sh runs the binary it fetched as root and checked only that the
      # file was not empty, and a person downloading by hand had nothing to
      # compare against at all - the whole guarantee was TLS to two hosts. The
      # project already pins the digests of the provider CLIs it downloads;
      # this is the same promise for its own artifacts.
      #
      # Hashed from the published assets, so the file describes the bytes a
      # user will actually receive.
      - name: Publish SHA256SUMS
        id: sha256sums
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const crypto = require('crypto');
            const release_id = parseInt(process.env.RELEASE_ID, 10);
            const {owner, repo} = context.repo;

            const assets = await github.paginate(github.rest.repos.listReleaseAssets,
              {owner, repo, release_id, per_page: 100});

            const lines = [];
            const entries = [];

            for (const asset of assets.sort((a, b) => a.name.localeCompare(b.name))) {
              if (asset.name === 'SHA256SUMS') continue;

              const {data} = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: asset.id,
                headers: {accept: 'application/octet-stream'}
              });

              const digest = crypto.createHash('sha256').update(Buffer.from(data)).digest('hex');
              lines.push(`${digest}  ${asset.name}`);
              entries.push({digest, name: asset.name});
            }

            core.info(lines.join('\n'));

            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id,
              name: 'SHA256SUMS',
              data: lines.join('\n') + '\n'
            });

            // Bun 1.4 deliberately uses one Nehalem/SSE4.2 x64 runtime behind
            // the default and baseline compatibility names. Only those exact
            // same-platform pairs may share a digest. Any extra member - even a
            // third asset alongside an allowed pair - is unexpected.
            //
            // Reported as an output rather than failing this job: a failure
            // here is a failure of build-binaries to the release workflow,
            // whose cleanup deletes the release and the tag on exactly that -
            // the assets this check was placed after the upload to leave.
            // refuse-duplicate-digests in create_release.yml is what fails.
            const allowedAliases = [
              new Set(['MySpeed-linux-x64', 'MySpeed-linux-x64-baseline']),
              new Set(['MySpeed-windows-x64.exe', 'MySpeed-windows-x64-baseline.exe'])
            ];
            const byDigest = new Map();
            for (const entry of entries) {
              const group = byDigest.get(entry.digest) ?? [];
              group.push(entry);
              byDigest.set(entry.digest, group);
            }
            const isAllowedAlias = (group) => {
              const names = new Set(group.map(({name}) => name));
              return allowedAliases.some((allowed) => allowed.size === group.length
                && allowed.size === names.size && [...names].every((name) => allowed.has(name)));
            };
            const unexpected = [...byDigest.values()]
              .filter((group) => group.length > 1 && !isAllowedAlias(group))
              .flat();
            const duplicates = unexpected.map(({digest, name}) => `${digest}  ${name}`).join(', ');
            core.setOutput('duplicate-digests', duplicates);
            if (duplicates !== '') core.warning(`unexpected assets share a digest: ${duplicates}`);
