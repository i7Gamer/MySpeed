name: Build Binaries

# Every job checks out the exact, already-versioned qualification commit.
# Nothing here creates tags, publishes releases, or changes the source version.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      windows_stamp:
        required: true
        type: string

# Dependency scripts and compiled artifacts execute only with repository read access.
permissions:
  contents: read

jobs:
  build-windows:
    name: "Windows (${{ matrix.label }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bun 1.4.2's default and baseline target names both use the unified
          # Nehalem/SSE4.2 runtime and dispatch newer AVX instructions at run
          # time. Keep both names for existing direct-download and MSI URLs.
          - label: x64
            target: bun-windows-x64
            artifact_name: MySpeed-windows-x64.exe
          - label: x64-baseline
            target: bun-windows-x64
            artifact_name: MySpeed-windows-x64-baseline.exe

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to the unified-baseline runtime qualified for this release.
          bun-version: 1.4.2

      - name: Validate qualification inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
        run: bun scripts/release/validate-inputs.mjs

      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Generate third-party notices
        run: bun scripts/generate-third-party-notices.mjs

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: bun scripts/move-client-build.js

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      # The native unified runtime avoids the obsolete baseline download. The
      # frozen four-part MySpeed stamp is shared by every artifact in this run.
      - name: Compile binary
        shell: pwsh
        env:
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
        run: |
          bun scripts/build-binary.mjs --target=${{ matrix.target }} --windows-version="$env:WINDOWS_STAMP" --outfile MySpeed.exe
          if ($LASTEXITCODE -ne 0) { throw "the binary did not compile (exit $LASTEXITCODE)" }

      # This starts the real compiled graph without listeners. Full native
      # network-isolated acceptance and CPU-floor evidence remain promotion gates.
      - name: Windows listener-free rehearsal
        shell: pwsh
        run: ./scripts/verify-binary.ps1 -Binary ./MySpeed.exe -ListenerFree -EvidenceDirectory ./qualification-evidence

      - name: Verify Windows version metadata
        shell: pwsh
        env:
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
        run: |
          $metadata = (Get-Item -LiteralPath ./MySpeed.exe).VersionInfo
          if ($metadata.FileVersion -ne $env:WINDOWS_STAMP -or $metadata.ProductVersion -ne $env:WINDOWS_STAMP) {
            throw 'Windows binary metadata does not match the frozen qualification stamp'
          }
          $evidence = @{
            fileVersion = $metadata.FileVersion
            productVersion = $metadata.ProductVersion
            windowsStamp = $env:WINDOWS_STAMP
            artifactSha256 = (Get-FileHash -LiteralPath ./MySpeed.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $evidence | ConvertTo-Json | Set-Content -LiteralPath windows-version.json -Encoding utf8NoBOM
          (Get-FileHash -LiteralPath windows-version.json -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -LiteralPath windows-version.json.sha256 -Encoding utf8NoBOM

      - name: Collect verifier summary
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref }}
        run: bun scripts/qualification/collect-summary.mjs --evidence-dir qualification-evidence --output qualification-summary.json --source-sha "$SOURCE_SHA" --mode listener-free-reset

      # Both legs compile to MySpeed.exe - build-msi's WiX source resolves
      # against that name - so the matrix value is all that keeps the two
      # variants apart once they leave the job.
      - name: Hash verified binary
        shell: bash
        env:
          ASSET_PATH: MySpeed.exe
        run: |
          bun -e 'const fs = require("fs"); const {createHash} = require("crypto"); const file = process.env.ASSET_PATH; fs.writeFileSync(file + ".sha256", createHash("sha256").update(fs.readFileSync(file)).digest("hex") + "\n");'

      - name: Upload artifact for MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            MySpeed.exe
            MySpeed.exe.sha256
            qualification-summary.json
            qualification-summary.json.sha256
            windows-version.json
            windows-version.json.sha256
            qualification-evidence/
          if-no-files-found: error

  build-linux:
    name: "Linux (${{ matrix.label }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bun 1.4.2's default and baseline x64 names both select its unified
          # Nehalem/SSE4.2 runtime, which dispatches AVX2/AVX-512 paths at run
          # time. Both artifact names remain for compatibility with old URLs.
          # Every native leg must run the same required artifact checks.
          - label: x64
            target: bun-linux-x64
            runner: ubuntu-latest
            artifact_name: MySpeed-linux-x64
            verify: true
          - label: x64-baseline
            # Explicit baseline targets still request a separate runtime
            # download; compile natively and retain the compatibility filename.
            target: bun-linux-x64
            runner: ubuntu-latest
            artifact_name: MySpeed-linux-x64-baseline
            verify: true
          - label: arm64
            target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            artifact_name: MySpeed-linux-arm64
            verify: true

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to the unified-baseline runtime qualified for this release.
          bun-version: 1.4.2

      - name: Validate qualification inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
        run: bun scripts/release/validate-inputs.mjs

      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Generate third-party notices
        run: bun scripts/generate-third-party-notices.mjs

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: bun scripts/move-client-build.js

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      - name: Compile binary
        run: bun scripts/build-binary.mjs --target=${{ matrix.target }} --outfile MySpeed

      - name: Rename binary
        run: mv MySpeed ${{ matrix.artifact_name }}

      # The same gate the Windows job carries, for the same reason: a green
      # compile says nothing about whether the binary runs, and the crash this
      # matrix exists for happens at startup long after the compiler is happy.
      # Before the upload, so a binary that never boots fails the release rather
      # than being attached to it.
      #
      # The runner has AVX2, so for the baseline leg this proves the binary is
      # not broken - not that it fixes a machine without AVX2.
      - name: Verify binary boots and serves
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          SOURCE_SHA: ${{ inputs.ref }}
        run: |
          node scripts/qualification/verify-standalone.mjs \
            --artifact "$ARTIFACT_NAME" --repo "$PWD" --source-sha "$SOURCE_SHA" \
            --evidence-dir "$PWD/qualification-evidence" --original-build-root "$PWD"
          node scripts/qualification/collect-summary.mjs --evidence-dir qualification-evidence \
            --output qualification-summary.json --source-sha "$SOURCE_SHA" --mode full

      # Execute the actual candidate under the oldest x64 CPU contract Bun 1.4
      # supports. The reset command loads the compiled application and opens its
      # SQLite database, but returns before starting listeners, schedulers or
      # providers. Empty current server lists stop top-level discovery, and the
      # network namespace makes that isolation a gate rather than an assumption.
      - name: Verify x64 binary on Nehalem CPU
        if: ${{ startsWith(matrix.target, 'bun-linux-x64') }}
        shell: bash
        env:
          CPU_PROBE_TIMEOUT_SECONDS: 60
          RESET_NOTHING_TO_DO_EXIT: 113
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user

          artifact="$(realpath "./${{ matrix.artifact_name }}")"
          probe_work="$(mktemp -d)"
          trap 'sudo rm -rf -- "$probe_work"' EXIT
          mkdir -p "$probe_work/data/servers"
          printf '{}\n' > "$probe_work/data/servers/ookla.json"
          printf '{}\n' > "$probe_work/data/servers/librespeed.json"

          set +e
          (
            cd "$probe_work"
            timeout "${CPU_PROBE_TIMEOUT_SECONDS}s" sudo unshare --net -- \
              /usr/bin/qemu-x86_64 -cpu Nehalem "$artifact" --reset-password
          )
          probe_status=$?
          set -e

          if [ "$probe_status" -ne "$RESET_NOTHING_TO_DO_EXIT" ]; then
            echo "::error::Nehalem CPU probe exited $probe_status, expected $RESET_NOTHING_TO_DO_EXIT."
            exit 1
          fi

      - name: Hash verified binary
        shell: bash
        env:
          ASSET_PATH: ${{ matrix.artifact_name }}
        run: |
          bun -e 'const fs = require("fs"); const {createHash} = require("crypto"); const file = process.env.ASSET_PATH; fs.writeFileSync(file + ".sha256", createHash("sha256").update(fs.readFileSync(file)).digest("hex") + "\n");'

      - name: Upload verified build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
            qualification-summary.json
            qualification-summary.json.sha256
            qualification-evidence/
          if-no-files-found: error

  build-macos:
    name: "macOS (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A runner per architecture, as the Linux matrix already does, because
          # this is the one job that was building both targets on one host - and
          # the host is what decides which native addons exist.
          #
          # @resvg/resvg-js resolves a platform-specific .node at require time,
          # and its bindings are optionalDependencies keyed by os/cpu (see
          # bun.lock). An install on an arm64 runner fetches darwin-arm64 and
          # skips darwin-x64, so the x64 binary was cross-compiled against a
          # binding that was never on disk. server/controller/opengraph.js no
          # longer imports it at boot, so that is now a broken preview image
          # rather than a server that will not start - but building each target
          # where its own bindings install is the actual fix, and it is what
          # makes the leg verifiable at all: a binary can only be booted on the
          # architecture it was built for.
          - arch: x64
            target: bun-darwin-x64
            runner: macos-15-intel
            artifact_name: MySpeed-macos-x64
            verify: true
          - arch: arm64
            target: bun-darwin-arm64
            runner: macos-latest
            artifact_name: MySpeed-macos-arm64
            verify: true

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to the unified-baseline runtime qualified for this release.
          bun-version: 1.4.2

      - name: Validate qualification inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
        run: bun scripts/release/validate-inputs.mjs

      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Generate third-party notices
        run: bun scripts/generate-third-party-notices.mjs

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: bun scripts/move-client-build.js

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Generate client embed
        run: bun run generate-client-embed

      - name: Compile binary
        run: bun scripts/build-binary.mjs --target=${{ matrix.target }} --outfile MySpeed

      - name: Rename binary
        run: mv MySpeed ${{ matrix.artifact_name }}

      # Listener-free rehearsal is not full native runtime qualification.
      # Promotion remains blocked until trusted, network-isolated evidence exists.
      - name: macOS listener-free rehearsal
        if: ${{ matrix.verify }}
        shell: pwsh
        run: ./scripts/verify-binary.ps1 -Binary ./${{ matrix.artifact_name }} -ListenerFree -EvidenceDirectory ./qualification-evidence

      - name: Collect verifier summary
        env:
          SOURCE_SHA: ${{ inputs.ref }}
        run: bun scripts/qualification/collect-summary.mjs --evidence-dir qualification-evidence --output qualification-summary.json --source-sha "$SOURCE_SHA" --mode listener-free-reset

      - name: Hash verified binary
        shell: bash
        env:
          ASSET_PATH: ${{ matrix.artifact_name }}
        run: |
          bun -e 'const fs = require("fs"); const {createHash} = require("crypto"); const file = process.env.ASSET_PATH; fs.writeFileSync(file + ".sha256", createHash("sha256").update(fs.readFileSync(file)).digest("hex") + "\n");'

      - name: Upload verified build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
            qualification-summary.json
            qualification-summary.json.sha256
            qualification-evidence/
          if-no-files-found: error

  build-zip:
    name: "Source ZIP"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Source users need this same minimum runtime for the tested dependency set.
          bun-version: 1.4.2

      - name: Validate qualification inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
        run: bun scripts/release/validate-inputs.mjs

      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Generate third-party notices
        run: bun scripts/generate-third-party-notices.mjs

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Move build folder
        run: bun scripts/move-client-build.js

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Generate migrations
        run: bun run generate-migrations

      - name: Generate integrations
        run: bun run generate-integrations

      - name: Create zip archive
        # bun.lock too: the archive requires Bun 1.4.2 or newer, and
        # without the lockfile `bun install` re-resolves every range - two people
        # unpacking one release get different builds of express and sequelize,
        # neither of them the one that was tested.
        run: zip -r MySpeed.zip build server package.json bun.lock

      - name: Verify packaged source on Node and Bun
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref }}
        run: |
          source_snapshot="$(mktemp -d)"
          trap 'rm -rf -- "$source_snapshot"' EXIT
          unzip -q MySpeed.zip -d "$source_snapshot"
          (cd "$source_snapshot" && bun install --production --frozen-lockfile)
          for runtime in node bun; do
            if [ "$runtime" = node ]; then
              image=node:22.19.0-bookworm-slim
            else
              image=oven/bun:1.4.2
            fi
            evidence="$(mktemp -d)"
            work="$(mktemp -d)"
            # Source installs serve cwd/build. Mount only the ZIP's client
            # assets there; the synthetic work/data directory remains separate.
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,source=$source_snapshot,target=/source,readonly" \
              --mount "type=bind,source=$PWD/scripts/qualification,target=/qualification,readonly" \
              --mount "type=bind,source=$evidence,target=/evidence" \
              --mount "type=bind,source=$work,target=/test-work" \
              --mount "type=bind,source=$source_snapshot/build,target=/test-work/build,readonly" \
              --entrypoint "$runtime" "$image" /qualification/check-artifact.mjs \
              --command "/usr/local/bin/$runtime" --artifact "/usr/local/bin/$runtime" \
              --arg /source/server/index.js --repo /source \
              --work /test-work --keep-work \
              --fixture-runtime "$runtime" --evidence-dir /evidence --source-sha "$SOURCE_SHA"
            node scripts/qualification/collect-summary.mjs --evidence-dir "$evidence" \
              --output "qualification-${runtime}-summary.json" --source-sha "$SOURCE_SHA" --mode full
          done

      - name: Hash source archive
        shell: bash
        env:
          ASSET_PATH: MySpeed.zip
        run: |
          bun -e 'const fs = require("fs"); const {createHash} = require("crypto"); const file = process.env.ASSET_PATH; fs.writeFileSync(file + ".sha256", createHash("sha256").update(fs.readFileSync(file)).digest("hex") + "\n");'

      - name: Upload verified build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MySpeed.zip
          path: |
            MySpeed.zip
            MySpeed.zip.sha256
            qualification-node-summary.json
            qualification-node-summary.json.sha256
            qualification-bun-summary.json
            qualification-bun-summary.json.sha256
          if-no-files-found: error

  build-static:
    name: "Install scripts"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Validate qualification inputs
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
        run: bun scripts/release/validate-inputs.mjs

      - name: Hash install scripts
        working-directory: scripts
        run: |
          for script in install.sh docker-install.sh chooser.sh; do
            sha256sum "$script" | cut -d ' ' -f 1 > "$script.sha256"
          done

      - name: Upload qualification scripts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-static
          path: |
            scripts/install.sh
            scripts/install.sh.sha256
            scripts/docker-install.sh
            scripts/docker-install.sh.sha256
            scripts/chooser.sh
            scripts/chooser.sh.sha256
          if-no-files-found: error
