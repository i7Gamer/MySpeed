name: Build Docker

# Both the release chain and the manual deploy go through here, so every image
# that reaches Docker Hub is a multi-arch manifest built on native runners. An
# amd64-only push would replace that manifest and leave arm64 hosts pulling an
# image they can only run under emulation.
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build from"
        required: true
        type: string
      tags:
        description: "Newline-separated tags to publish, without the image name"
        required: true
        type: string

env:
  REGISTRY_IMAGE: i7gamer/myspeed

# Publishing authenticates against Docker Hub with its own secrets, so the
# GITHUB_TOKEN only ever needs to read the repository. Leaving it unset means it
# inherits whatever the caller holds - contents: write, in the release chain.
permissions:
  contents: read

jobs:
  build:
    name: "Docker (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      # Built into the local daemon first so the image can be exercised before
      # anything reaches the registry. Each matrix job runs on a runner native to
      # its platform, so arm64 is genuinely executed rather than only compiled.
      - name: Build for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: myspeed:verify
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}

      - name: Verify the image before publishing
        run: bash scripts/verify-image.sh myspeed:verify

      # A cache hit on the verified build, so this republishes the same content
      # rather than compiling anything again.
      - name: Push verified image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: "Merge Docker Manifests"
    runs-on: ubuntu-latest
    needs: build
    # Never checks the repository out - it only pulls the digest artifacts and
    # pushes the manifest list - so it needs no token scopes at all.
    permissions: {}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One manifest list carrying both per-arch digests, published under every
      # requested tag at once. Each tag therefore points at the same multi-arch
      # manifest rather than at whichever architecture was pushed last.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag="${tag//[[:space:]]/}"
            [ -n "$tag" ] || continue
            tag_args+=(-t "${REGISTRY_IMAGE}:${tag}")
          done <<< "$TAGS"

          if [ ${#tag_args[@]} -eq 0 ]; then
            echo "::error::No tags to publish."
            exit 1
          fi

          digest_args=()
          for digest in *; do
            digest_args+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
