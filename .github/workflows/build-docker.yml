name: Build Docker OCI

on:
  workflow_call:
    inputs:
      ref:
        description: "Exact qualified commit SHA"
        required: true
        type: string
      version:
        description: "Committed release version"
        required: true
        type: string
      windows_stamp:
        description: "Frozen four-part build stamp"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: "Docker OCI (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Validate qualification inputs
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
        run: bun scripts/release/validate-inputs.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build immutable OCI archive once
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=oci,dest=${{ runner.temp }}/myspeed-${{ matrix.architecture }}.oci.tar
          cache-from: type=gha,scope=qualification-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=qualification-${{ matrix.platform }}

      - name: Load the exact OCI content for native verification
        env:
          OCI_ARCHIVE: ${{ runner.temp }}/myspeed-${{ matrix.architecture }}.oci.tar
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          skopeo copy --format v2s2 "oci-archive:$OCI_ARCHIVE" docker-daemon:myspeed:verify

      - name: Verify the exact image with outbound networking denied
        env:
          QUALIFICATION_EVIDENCE_DIRECTORY: ${{ runner.temp }}/myspeed-image-evidence-${{ matrix.architecture }}
          QUALIFICATION_SOURCE_SHA: ${{ inputs.ref }}
        run: bash scripts/verify-image.sh myspeed:verify

      - name: Record OCI content provenance
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          EVIDENCE_ROOT: ${{ runner.temp }}/myspeed-image-evidence-${{ matrix.architecture }}
          OCI_ARCHIVE: ${{ runner.temp }}/myspeed-${{ matrix.architecture }}.oci.tar
          OCI_ROOT: ${{ runner.temp }}/oci-${{ matrix.architecture }}
        run: |
          mkdir -p "$OCI_ROOT"
          tar -xf "$OCI_ARCHIVE" -C "$OCI_ROOT"
          bun scripts/release/inspect-oci.mjs --root "$OCI_ROOT" --platform "${{ matrix.platform }}" --output "$EVIDENCE_ROOT/oci-provenance.json" --container-inspect "$EVIDENCE_ROOT/container-inspect.json"
          sha256sum "$OCI_ARCHIVE" | cut -d ' ' -f 1 > "$OCI_ARCHIVE.sha256"
          mv -- "$OCI_ARCHIVE" "$OCI_ARCHIVE.sha256" "$EVIDENCE_ROOT/"

      - name: Upload qualified OCI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualified-oci-${{ matrix.architecture }}
          path: ${{ runner.temp }}/myspeed-image-evidence-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 7
