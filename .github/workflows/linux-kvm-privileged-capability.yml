name: Hosted Linux privileged KVM capability retry

# Same-repository PR or explicit manual, candidate-neutral and nonqualifying.
# The privileged retry is reached only after the same runner records an exact
# ordinary-user /dev/kvm permission denial. It downloads no media or QEMU.
on:
  pull_request:
    paths:
      - .github/workflows/linux-kvm-privileged-capability.yml
      - scripts/qualification/linux-kvm-capability.mjs
      - scripts/qualification/linux-kvm-privileged-capability.mjs
      - tests/server/linuxKvmCapability.test.js
      - tests/server/linuxKvmPrivilegedCapability.test.js
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  EXPECTED_EVENT_SHA: ${{ github.sha }}
  EXPECTED_RUN_ID: ${{ github.run_id }}
  EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  prepare:
    name: Seal privileged KVM retry closure
    if: github.repository == 'i7Gamer/MySpeed' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'development'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      nonce: ${{ steps.closure.outputs.nonce }}
    steps:
      - name: Checkout exact capability source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up minimum supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Set up locked test dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked test dependencies without lifecycle scripts
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run pure and injected privileged retry tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/server/linuxKvmCapability.test.js \
            tests/server/linuxKvmPrivilegedCapability.test.js

      - name: Seal exact two-module closure
        id: closure
        shell: bash
        run: |
          set -euo pipefail
          closure_root="$RUNNER_TEMP/linux-kvm-capability-closure"
          test ! -e "$closure_root"
          install -d -m 700 "$closure_root"
          install -m 600 scripts/qualification/linux-kvm-capability.mjs "$closure_root/linux-kvm-capability.mjs"
          install -m 600 scripts/qualification/linux-kvm-privileged-capability.mjs "$closure_root/linux-kvm-privileged-capability.mjs"
          nonce="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          node "$closure_root/linux-kvm-capability.mjs" emit-manifest \
            --source-sha "$EXPECTED_SOURCE_SHA" --event-sha "$EXPECTED_EVENT_SHA" \
            --run-id "$EXPECTED_RUN_ID" --run-attempt "$EXPECTED_RUN_ATTEMPT" \
            --nonce "$nonce" --output "$closure_root/closure.json"
          node "$closure_root/linux-kvm-privileged-capability.mjs" emit-manifest \
            --source-sha "$EXPECTED_SOURCE_SHA" --event-sha "$EXPECTED_EVENT_SHA" \
            --run-id "$EXPECTED_RUN_ID" --run-attempt "$EXPECTED_RUN_ATTEMPT" --nonce "$nonce" \
            --core "$closure_root/linux-kvm-capability.mjs" \
            --core-manifest "$closure_root/closure.json" \
            --output "$closure_root/privileged-closure.json"
          printf 'nonce=%s\n' "$nonce" >> "$GITHUB_OUTPUT"

      - name: Upload immutable privileged capability closure
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-kvm-privileged-capability-closure
          path: |
            ${{ runner.temp }}/linux-kvm-capability-closure/closure.json
            ${{ runner.temp }}/linux-kvm-capability-closure/linux-kvm-capability.mjs
            ${{ runner.temp }}/linux-kvm-capability-closure/linux-kvm-privileged-capability.mjs
            ${{ runner.temp }}/linux-kvm-capability-closure/privileged-closure.json
          if-no-files-found: error
          retention-days: 7

  observe:
    name: Retry exact KVM probe with minimum fixed privilege
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_NONCE: ${{ needs.prepare.outputs.nonce }}
    steps:
      - name: Download exact same-run closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-kvm-capability-closure

      - name: Set up exact runtime without source checkout
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Preserve ordinary observation then perform fixed privileged retry
        shell: bash
        run: |
          set -euo pipefail
          closure_root="$RUNNER_TEMP/linux-kvm-capability-closure"
          test -d "$closure_root" -a ! -L "$closure_root"
          mapfile -d '' -t closure_files < <(find "$closure_root" -mindepth 1 -maxdepth 1 -printf '%f\0' | LC_ALL=C sort -z)
          expected_files=(closure.json linux-kvm-capability.mjs linux-kvm-privileged-capability.mjs privileged-closure.json)
          test "${#closure_files[@]}" -eq "${#expected_files[@]}"
          test "${closure_files[*]}" = "${expected_files[*]}"
          for member in "${expected_files[@]}"; do
            test -f "$closure_root/$member" -a ! -L "$closure_root/$member"
          done
          work_root="$RUNNER_TEMP/myspeed-kvm-capability-$EXPECTED_NONCE"
          ordinary_result="$work_root/result.json"
          privileged_result="$work_root/privileged-result.json"
          set +e
          node "$closure_root/linux-kvm-capability.mjs" probe \
            --source-sha "$EXPECTED_SOURCE_SHA" --event-sha "$EXPECTED_EVENT_SHA" \
            --run-id "$EXPECTED_RUN_ID" --run-attempt "$EXPECTED_RUN_ATTEMPT" \
            --nonce "$EXPECTED_NONCE" --closure-root "$closure_root" \
            --manifest "$closure_root/closure.json" --result "$ordinary_result"
          ordinary_exit=$?
          set -e
          if [ "$ordinary_exit" -ne 0 ] && [ "$ordinary_exit" -ne 1 ]; then
            echo "Ordinary probe returned an unsupported exit status" >&2
            exit 1
          fi
          node - "$ordinary_result" "$ordinary_exit" <<'NODE'
          const fs = require("node:fs");
          const bytes = fs.readFileSync(process.argv[2]);
          if (bytes.length === 0 || bytes.length > 131072) throw new Error("ordinary result size is invalid");
          const value = JSON.parse(bytes.toString("utf8"));
          const exit = Number(process.argv[3]);
          if (!bytes.equals(Buffer.from(`${JSON.stringify(value)}\n`)) || value.schemaVersion !== 1 ||
              value.qualifying !== false || value.releaseGateCleared !== false ||
              (exit === 0 && (value.status !== "passed" || value.capability !== "usable")) ||
              (exit === 1 && (value.status !== "failed" || value.capability !== "permission-denied"))) {
            throw new Error("ordinary result is inconsistent with its exit status");
          }
          NODE
          node "$closure_root/linux-kvm-privileged-capability.mjs" retry \
            --source-sha "$EXPECTED_SOURCE_SHA" --event-sha "$EXPECTED_EVENT_SHA" \
            --run-id "$EXPECTED_RUN_ID" --run-attempt "$EXPECTED_RUN_ATTEMPT" \
            --nonce "$EXPECTED_NONCE" --closure-root "$closure_root" \
            --core-manifest "$closure_root/closure.json" \
            --manifest "$closure_root/privileged-closure.json" \
            --ordinary-result "$ordinary_result" --result "$privileged_result"

      - name: Assert bounded nonqualifying result
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/myspeed-kvm-capability-$EXPECTED_NONCE/privileged-result.json"
          node - "$result" <<'NODE'
          const fs = require("node:fs");
          const bytes = fs.readFileSync(process.argv[2]);
          if (bytes.length === 0 || bytes.length > 131072) throw new Error("result size is invalid");
          const value = JSON.parse(bytes.toString("utf8"));
          if (!bytes.equals(Buffer.from(`${JSON.stringify(value)}\n`)) || value.schemaVersion !== 1 ||
              value.status !== "observed" ||
              value.classification !== "github-hosted-linux-kvm-privileged-capability-nonqualifying" ||
              !["usable", "ordinary-usable"].includes(value.capability) || value.qualifying !== false ||
              value.releaseGateCleared !== false ||
              (value.capability === "usable" && value.retryPerformed !== true) ||
              (value.capability === "ordinary-usable" && value.retryPerformed !== false)) {
            throw new Error("privileged capability result was not a successful nonqualifying observation");
          }
          NODE

      - name: Upload both bounded nonqualifying observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-kvm-privileged-capability-evidence
          path: |
            ${{ runner.temp }}/myspeed-kvm-capability-${{ needs.prepare.outputs.nonce }}/result.json
            ${{ runner.temp }}/myspeed-kvm-capability-${{ needs.prepare.outputs.nonce }}/privileged-result.json
          if-no-files-found: error
          retention-days: 7
