name: Deploy Development Release to DockerHub

# Manual only: this publishes i7gamer/myspeed:development to Docker Hub, which
# should be a deliberate act rather than a side effect of every push.
on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Loaded locally first so the image is exercised before it is published.
      - name: Build for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: myspeed:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image before publishing
        run: bash scripts/verify-image.sh myspeed:verify

      # Cache hit on the verified build, so the published content is identical.
      - name: Push verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: i7gamer/myspeed:development
          cache-from: type=gha
          cache-to: type=gha,mode=max