name: Windows CPU-floor branch qualification

# Manual, hosted-only, non-publishing execution.
# Runs the CPU-floor guest against the Windows build produced by the dispatched commit.
# A branch run establishes that this commit's CPU-floor build starts, binds a loopback
# listener it owns and stops cleanly on a floor-level CPU. It does not reproduce a result
# sealed at release time, because an unreleased commit has none - see the published
# sibling workflow for that claim. All outputs are strictly non-qualifying
# (qualifying: false, releaseGateCleared: false), and no qualification manifest is written.
#
# The guest bundle, the sealed closure and the KVM execution are the shared
# windows-cpu-floor-candidate.yml, which the release qualification also calls. This workflow only
# reads the version, builds the candidate and produces this run's CPU readiness probe.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN-WINDOWS-BASELINE-CPU-FLOOR
        required: true
        type: string
      stage3_installer_confirmation:
        description: >-
          Stage 3 installer boot policy. no-input sends nothing and is the default; the single bounded
          Enter and the bounded cadence of Enters are separate explicit choices from the installer
          preparation Stage 2 performs, and neither guarantees that the firmware boots.
        required: true
        default: no-input
        type: choice
        options:
          - no-input
          - single-enter-before-setup-v1
          - single-enter-after-first-frame-v2
          - cadence-enter-before-setup-v3

permissions:
  actions: read
  contents: read
env:
  WORKFLOW_CONFIRMATION: RUN-WINDOWS-BASELINE-CPU-FLOOR

jobs:
  # The candidate's own version, read from the commit under test rather than supplied by the
  # dispatcher, so a branch run cannot be told it is testing some other version. Every other job
  # needs this one, so nothing runs without the typed confirmation.
  version:
    name: Read candidate version from the dispatched commit
    if: github.repository == 'i7Gamer/MySpeed' && inputs.confirmation == 'RUN-WINDOWS-BASELINE-CPU-FLOOR'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      windows_stamp: ${{ steps.read.outputs.windows_stamp }}
    steps:
      - name: Verify dispatch confirmation
        shell: bash
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "${INPUT_CONFIRMATION}" != "${WORKFLOW_CONFIRMATION}" ]]; then
            echo "::error::Confirmation mismatch. Expected ${WORKFLOW_CONFIRMATION}"
            exit 1
          fi

      - name: Checkout exact harness source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read version
        id: read
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e 'process.stdout.write(require("./package.json").version)')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version is not a three-part version: $version"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'windows_stamp=%s.0\n' "$version" >> "$GITHUB_OUTPUT"

  # Built through the release recipe rather than inline bun commands: the binary under test has to
  # be the one that would ship, or a green run says nothing about the release build.
  build:
    name: Build the CPU-floor Windows executable
    needs: [version]
    if: github.repository == 'i7Gamer/MySpeed'
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
      windows_stamp: ${{ needs.version.outputs.windows_stamp }}
      windows_only: true

  # The probe comes from this run, so a dispatcher cannot point the guest at an earlier run's archive.
  readiness:
    name: Produce this run's Windows CPU readiness probe
    needs: [version]
    if: github.repository == 'i7Gamer/MySpeed'
    uses: ./.github/workflows/windows-cpu-readiness.yml

  floor:
    name: Windows CPU floor
    needs: [version, build, readiness]
    if: github.repository == 'i7Gamer/MySpeed'
    uses: ./.github/workflows/windows-cpu-floor-candidate.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
      windows_stamp: ${{ needs.version.outputs.windows_stamp }}
      probe_artifact_id: ${{ needs.readiness.outputs.probe_artifact_id }}
      probe_artifact_digest: ${{ needs.readiness.outputs.probe_artifact_digest }}
      stage3_installer_confirmation: ${{ inputs.stage3_installer_confirmation }}
      # Must equal this job's name: the execute job's API name is "<this name> / <its own name>".
      caller_job_name: Windows CPU floor
