name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.1.0)"
        required: true
        type: string

# The repository default for GITHUB_TOKEN is read-only, which made every release
# API call 403. Reusable workflows can only narrow the caller's permissions, so
# this has to be granted here for build-binaries/build-msi/finalize to inherit it.
# contents: write covers creating the tag and release, uploading the assets and
# pushing the version bump; pull-requests: read is for the generated changelog.
permissions:
  contents: write
  pull-requests: read

# One release at a time, and never cancelled halfway.
#
# Two dispatches used to run side by side: both bump package.json and push to the
# default branch, so the second push can be rejected non-fast-forward after its
# own tag guard has already passed, and both reach publish-docker, where the
# later `imagetools create` decides what :latest means. The group is shared with
# the manual dev deploy, which moves the same tag from the other side.
#
# cancel-in-progress is false on purpose: a cancelled release is the one shape
# neither recovery job below can clean up.
concurrency:
  group: release-and-registry
  cancel-in-progress: false

jobs:
  # Gates everything below it: no tag, no release and no artefact gets cut
  # unless the suite passes first.
  test:
    name: "Tests"
    uses: ./.github/workflows/test.yml

  create-release:
    name: "Create Release"
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      # Dispatch carries no branch restriction and the push below targets the
      # default branch by name, so a run started from a feature branch would
      # push that branch's HEAD onto the default one. Refused here, before the
      # checkout writes a write-token into .git/config or anything is pushed.
      #
      # Both names read through env, for the reason stated below the checkout: a
      # `${{ }}` expression is substituted into the shell source before bash
      # parses it, and a refname may hold `"`, `;`, a backtick or `$()`. Spliced
      # in, the branch this step exists to refuse was the branch that decided
      # what the step ran - inside the one job in this workflow holding
      # contents: write, and at the one step that runs before anything else.
      - name: Refuse to release from a non-default branch
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Release must be dispatched from the default branch, not $REF_NAME." >&2
            exit 1
          fi

      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # The version now comes from the dispatch input rather than a pushed tag.
      # Normalised so that both "1.1.0" and "v1.1.0" are accepted.
      # Read through env, never spliced into the script body. A `${{ }}`
      # expression is substituted into the shell source before bash parses it,
      # so the dispatch input reached this step as code - eleven lines above the
      # regex that exists precisely because the value is not trusted, in a job
      # where checkout has already written a contents:write token into
      # .git/config. Dispatching needs write access, so this is not a boundary
      # being crossed; it is the difference between "can cut a release" and "can
      # run anything inside the release job". The cleanup jobs below already do
      # it this way, for the same reason.
      - name: Get version from input
        id: get_version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RAW_VERSION#v}"

          # Three numeric parts and nothing after them, which is narrower than
          # semver allows and exactly what this pipeline can deliver. build-msi
          # splices the version into WiX's Product/@Version as "<version>.0",
          # which must be numeric dotted fields, so a prerelease suffix or a
          # fourth part reached candle and failed it - by which point the tag is
          # pushed, all six binaries are uploaded, and Docker Hub's :latest has
          # already been replaced, none of which the failure path undoes.
          # Refused here instead, before anything has been published.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a release version. Use three numbers, as in 1.4.0 - prereleases and four-part versions cannot be built into the MSI."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      # The bump has to land before the tag is cut. server/routes/system.js reads
      # packageJson.version at import time, so it is compiled into every binary
      # and shown by /version against the latest release tag. Bumping afterwards
      # shipped binaries stamped with the previous version, which then reported
      # themselves as out of date the moment they started.
      #
      # Through env like the steps around it. The value is validated by the time
      # it gets here, so this is the rule being kept rather than a hole being
      # closed - and a rule with exceptions in the file that states it is one
      # nobody can check by reading.
      #
      # And through --arg for the same reason, one interpreter further in. Written
      # as `jq ".version = \"$VERSION\""`, the shell expands the variable before
      # jq is executed at all, so what jq parses is a program built out of the
      # value - the care taken on the line above buys nothing the moment the
      # language changes. --arg binds it as data, which is what env: does for the
      # shell.
      - name: Bump version files
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > tmp && mv tmp package.json
          jq --arg v "$VERSION" '.version = $v' client/package.json > tmp && mv tmp client/package.json

      # Read through env, never spliced into the script body - the same rule
      # the branch guard above follows, in the one step that performs the push
      # that guard exists to protect.
      - name: Commit and push version bump
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json client/package.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to $VERSION"
            git push origin HEAD:"$DEFAULT_BRANCH"
          fi

      # Not github.sha: that is the dispatched commit, which predates the bump.
      - name: Resolve release commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # The tag has to be pushed here, with git. A draft release carries a tag_name
      # but does not create the ref: GitHub only creates it when the release is
      # published, which is finalize-release - long after every build job has tried
      # to check the tag out and failed. Releases only ever succeeded when a tag
      # left over from an earlier attempt happened to still be there.
      #
      # Both through env, for the reason stated at the branch guard - and this is
      # the step that guard exists to protect, so it is the last one that should
      # have been splicing anything into a shell.
      - name: Push release tag
        env:
          TAG: ${{ steps.get_version.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git tag "$TAG" "$SHA"
          git push origin "$TAG"

      # Everything downstream builds from this tag rather than from the dispatched
      # ref, so the artifacts and the version they report come from the same commit.
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          target_commitish: ${{ steps.sha.outputs.sha }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false

  build-binaries:
    name: "Build Binaries"
    needs: create-release
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit

  # Beside the binaries, not after them: this is the slow half, and it only
  # pushes untagged digests, which publish nothing anyone can pull by name.
  build-docker:
    name: "Build Docker"
    needs: create-release
    uses: ./.github/workflows/build-docker.yml
    with:
      ref: v${{ needs.create-release.outputs.version }}
    secrets: inherit

  # The tags, and the first moment this release is visible to `docker pull`.
  #
  # Held behind build-binaries because that is the job whose failure tears the
  # release down: cleanup-on-failure deletes the tag and the draft, and it has
  # no reach into a registry. Published beside the binaries, as it was until
  # 1.3.3, a failed release left `:latest` on a version that no longer had a
  # GitHub release - which happened three times the night 1.3.3 was cut, and
  # left `docker pull myspeed` on an unreleased build for about four hours.
  #
  # Also behind build-msi: the MSI is the other artifact the release must ship,
  # so :latest must not be published before it has built - otherwise a failed
  # MSI leaves Docker on a version whose GitHub release stays a draft.
  publish-docker:
    name: "Publish Docker"
    needs: [create-release, build-binaries, build-docker, build-msi]
    uses: ./.github/workflows/publish-docker.yml
    with:
      tags: |
        latest
        ${{ needs.create-release.outputs.version }}
    secrets: inherit

  build-msi:
    name: "Build MSI"
    needs: [create-release, build-binaries]
    uses: ./.github/workflows/build-msi.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit

  # The two installers, hashed after the fact.
  #
  # build-binaries' own checksums job lives inside that workflow, and build-msi
  # needs the whole of it - so the list was always written before either .msi
  # existed. SHA256SUMS therefore described the binaries, the source ZIP and the
  # install scripts and never the installers, on every release rather than only
  # on the first: a Windows user downloading the one artifact that installs a
  # LocalSystem service found no line to check it against, and no install script
  # checks it for them either.
  #
  # Appending here rather than moving the original job. Moving it would delay
  # the three install scripts, which that job also publishes and which need
  # nothing a build produced - and, taken literally, would make one failing MSI
  # leg suppress the checksum file for every other asset, which is worse than
  # today and against this workflow's own position that a partial release is
  # still worth having.
  checksums-msi:
    name: "Checksums for the installers"
    runs-on: ubuntu-latest
    needs: [create-release, build-msi]
    # always(), so a failed or skipped MSI leg leaves the list exactly as
    # build-binaries wrote it rather than skipping this job and, with it, any
    # chance of the file being completed.
    if: always() && needs.create-release.result == 'success'
    steps:
      - name: Add any unhashed asset to SHA256SUMS
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const crypto = require('crypto');
            const release_id = parseInt(process.env.RELEASE_ID, 10);
            const {owner, repo} = context.repo;

            const assets = await github.paginate(github.rest.repos.listReleaseAssets,
              {owner, repo, release_id, per_page: 100});

            const published = assets.find((asset) => asset.name === 'SHA256SUMS');

            const body = async (asset) => {
              const {data} = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: asset.id,
                headers: {accept: 'application/octet-stream'}
              });
              return Buffer.from(data);
            };

            // What the earlier job already hashed, kept as it was: those bytes
            // have not changed, and re-downloading six binaries to prove it
            // would double the transfer for nothing.
            const digests = new Map();

            if (published)
              for (const line of (await body(published)).toString().split('\n')) {
                const match = /^([0-9a-f]{64})\s\s(.+)$/.exec(line.trim());
                if (match) digests.set(match[2], match[1]);
              }

            const added = [];

            for (const asset of assets) {
              if (asset.name === 'SHA256SUMS' || digests.has(asset.name)) continue;

              digests.set(asset.name, crypto.createHash('sha256').update(await body(asset)).digest('hex'));
              added.push(asset.name);
            }

            if (added.length === 0) {
              core.info('Every asset is already listed; SHA256SUMS left alone.');
              return;
            }

            core.info(`Adding: ${added.join(', ')}`);

            const lines = [...digests.entries()]
              .sort(([left], [right]) => left.localeCompare(right))
              .map(([name, digest]) => `${digest}  ${name}`);

            core.info(lines.join('\n'));

            // Replaced rather than uploaded beside: a release cannot carry two
            // assets of one name, so the old one goes first.
            if (published)
              await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: published.id});

            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id,
              name: 'SHA256SUMS',
              data: lines.join('\n') + '\n'
            });

  # After publish-docker rather than beside it: this is what turns the draft
  # into the published release, and the body it writes names the Docker tags.
  #
  # checksums-msi is in the list because this is what un-drafts the release: a
  # release made public before the checksum file was completed would hand out
  # installers nothing could verify, which is the whole point of the job above.
  finalize-release:
    name: "Finalize Release"
    needs: [create-release, build-binaries, publish-docker, build-msi, checksums-msi]
    uses: ./.github/workflows/finalize-release.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit

  # Tearing the release down is only right when nothing usable came out of it.
  # create-release failing leaves a bare tag and an empty draft; build-binaries
  # failing leaves a draft with a platform missing. Neither is salvageable, so
  # the tag is freed up and the same version can be dispatched again.
  #
  # A build-docker, publish-docker or build-msi failure deliberately does not
  # reach here. Every platform binary is already attached by then and the release
  # is still a draft, so deleting it would destroy good artifacts over a side
  # channel that can be retried by hand. report-partial-release says what was
  # left behind instead.
  #
  # What this job can undo is now the whole of what a failure at this point has
  # published. It deletes a tag and a draft release, and it has no reach into a
  # registry - which is why publish-docker waits for build-binaries rather than
  # running beside it. A failure here leaves untagged digests on Docker Hub:
  # unreferenced, unresolvable by `docker pull`, and collectable, rather than
  # `:latest` moved to a version whose release is about to be deleted.
  #
  # The version bump commit is not reverted. Rewriting the default branch to undo
  # a failed release is worse than leaving it, and it costs nothing: re-running
  # the same version finds package.json already correct, skips the commit, and
  # cuts the tag afresh.
  cleanup-on-failure:
    name: "Cleanup on Failure"
    runs-on: ubuntu-latest
    needs: [create-release, build-binaries]
    if: |
      failure()
      && (needs.create-release.result == 'failure' || needs.build-binaries.result == 'failure')
    steps:
      # Both ids are read through env rather than interpolated into the script
      # body: when create-release fails they are empty, and an empty expression
      # spliced into the source produced a SyntaxError that masked the real error.
      - name: Delete release
        if: needs.create-release.outputs.release_id != ''
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            try {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: parseInt(process.env.RELEASE_ID, 10)
              });
              console.log('Release deleted');
            } catch (e) {
              console.log('Failed to delete release:', e.message);
            }

      - name: Delete tag
        if: needs.create-release.outputs.version != ''
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/v${process.env.VERSION}`
              });
              console.log('Tag deleted');
            } catch (e) {
              console.log('Failed to delete tag:', e.message);
            }

  # A cancelled run is neither of the two cases below.
  #
  # Both of them key on failure(), which a cancellation does not satisfy - and
  # `cancelled()` at the workflow level is exactly the moment a tag has been cut,
  # a version bumped and the assets left half-uploaded. Nothing said so: the run
  # ended grey, and the next dispatch of that version was refused by
  # create-release's own tag guard with no explanation anywhere.
  #
  # It reports rather than deletes. What survived a cancellation is not knowable
  # from here - the upload may have been halfway through an asset - and deleting
  # a release somebody stopped on purpose is not this job's decision to make.
  report-cancelled-release:
    name: "Report Cancelled Release"
    runs-on: ubuntu-latest
    needs: [create-release]
    if: cancelled() && needs.create-release.result == 'success'
    steps:
      - name: Say what was left behind
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          {
            echo "### Release v$VERSION was cancelled part way through"
            echo
            echo "The tag and the draft release exist, the version bump is on the default"
            echo "branch, and the assets are whatever had finished uploading. Dispatching"
            echo "v$VERSION again will be refused while the tag is there."
            echo
            echo "Look at the draft, then either publish it by hand or free the version up:"
            echo
            echo '```'
            echo "gh release delete v$VERSION --cleanup-tag --yes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::Release v$VERSION was cancelled. Tag v$VERSION is taken - delete it before re-running this version."

  # The counterpart to cleanup-on-failure: the release survived, so say what is
  # sitting there and how to get rid of it, rather than leaving an unexplained
  # draft and a version number that can no longer be dispatched.
  report-partial-release:
    name: "Report Partial Release"
    runs-on: ubuntu-latest
    needs: [create-release, build-binaries, build-docker, publish-docker, build-msi, checksums-msi,
      finalize-release]
    if: |
      failure()
      && needs.create-release.result == 'success'
      && needs.build-binaries.result == 'success'
    steps:
      - name: Summarise what survived
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          DOCKER_BUILD_RESULT: ${{ needs.build-docker.result }}
          DOCKER_PUBLISH_RESULT: ${{ needs.publish-docker.result }}
          MSI_RESULT: ${{ needs.build-msi.result }}
          FINALIZE_RESULT: ${{ needs.finalize-release.result }}
        run: |
          {
            echo "### Release v$VERSION kept as a draft"
            echo
            echo "Every platform binary built and uploaded, so the release was not deleted."
            echo
            echo "| Job | Result |"
            echo "| :-- | :-- |"
            echo "| Build Docker | $DOCKER_BUILD_RESULT |"
            echo "| Publish Docker | $DOCKER_PUBLISH_RESULT |"
            echo "| Build MSI | $MSI_RESULT |"
            echo "| Finalize Release | $FINALIZE_RESULT |"
            echo

            # Which of the two the images reached matters to whoever picks this
            # up: a build that pushed digests published nothing pullable, while
            # a publish that succeeded has already moved :latest.
            if [ "$DOCKER_PUBLISH_RESULT" = "success" ]; then
              echo "\`:latest\` and \`:$VERSION\` are already on Docker Hub."
            else
              echo "No Docker tag was published. The per-arch digests may be up, but"
              echo "nothing resolves to them and \`:latest\` still points where it did."
            fi
            echo
            echo "Fix the failing job and publish the draft by hand, or free the version"
            echo "number up for another run with:"
            echo
            echo '```'
            echo "gh release delete v$VERSION --cleanup-tag --yes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::Release v$VERSION was left as a draft with its binaries intact. Tag v$VERSION is now taken - delete it before re-running this version."