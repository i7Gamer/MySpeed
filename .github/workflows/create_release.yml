name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.1.0)"
        required: true
        type: string

# The repository default for GITHUB_TOKEN is read-only, which made every release
# API call 403. Reusable workflows can only narrow the caller's permissions, so
# this has to be granted here for build-binaries/build-msi/finalize to inherit it.
# contents: write covers creating the tag and release, uploading the assets and
# pushing the version bump; pull-requests: read is for the generated changelog.
permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    name: "Create Release"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # The version now comes from the dispatch input rather than a pushed tag.
      # Normalised so that both "1.1.0" and "v1.1.0" are accepted.
      - name: Get version from input
        id: get_version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a valid semver version."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      # The bump has to land before the tag is cut. server/routes/system.js reads
      # packageJson.version at import time, so it is compiled into every binary
      # and shown by /version against the latest release tag. Bumping afterwards
      # shipped binaries stamped with the previous version, which then reported
      # themselves as out of date the moment they started.
      - name: Bump version files
        run: |
          V="${{ steps.get_version.outputs.version }}"
          jq ".version = \"$V\"" package.json > tmp && mv tmp package.json
          jq ".version = \"$V\"" client/package.json > tmp && mv tmp client/package.json

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json client/package.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      # Not github.sha: that is the dispatched commit, which predates the bump.
      - name: Resolve release commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # The tag has to be pushed here, with git. A draft release carries a tag_name
      # but does not create the ref: GitHub only creates it when the release is
      # published, which is finalize-release - long after every build job has tried
      # to check the tag out and failed. Releases only ever succeeded when a tag
      # left over from an earlier attempt happened to still be there.
      - name: Push release tag
        run: |
          git tag "${{ steps.get_version.outputs.tag }}" "${{ steps.sha.outputs.sha }}"
          git push origin "${{ steps.get_version.outputs.tag }}"

      # Everything downstream builds from this tag rather than from the dispatched
      # ref, so the artifacts and the version they report come from the same commit.
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          target_commitish: ${{ steps.sha.outputs.sha }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false

  build-binaries:
    name: "Build Binaries"
    needs: create-release
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit

  build-docker:
    name: "Build Docker"
    needs: create-release
    uses: ./.github/workflows/build-docker.yml
    with:
      ref: v${{ needs.create-release.outputs.version }}
      tags: |
        latest
        ${{ needs.create-release.outputs.version }}
    secrets: inherit

  build-msi:
    name: "Build MSI"
    needs: [create-release, build-binaries]
    uses: ./.github/workflows/build-msi.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit

  finalize-release:
    name: "Finalize Release"
    needs: [create-release, build-binaries, build-docker, build-msi]
    uses: ./.github/workflows/finalize-release.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit

  # Tearing the release down is only right when nothing usable came out of it.
  # create-release failing leaves a bare tag and an empty draft; build-binaries
  # failing leaves a draft with a platform missing. Neither is salvageable, so
  # the tag is freed up and the same version can be dispatched again.
  #
  # A build-docker or build-msi failure deliberately does not reach here. Every
  # platform binary is already attached by then and the release is still a draft,
  # so deleting it would destroy good artifacts over a side channel that can be
  # retried by hand. report-partial-release says what was left behind instead.
  #
  # The version bump commit is not reverted. Rewriting the default branch to undo
  # a failed release is worse than leaving it, and it costs nothing: re-running
  # the same version finds package.json already correct, skips the commit, and
  # cuts the tag afresh.
  cleanup-on-failure:
    name: "Cleanup on Failure"
    runs-on: ubuntu-latest
    needs: [create-release, build-binaries]
    if: |
      failure()
      && (needs.create-release.result == 'failure' || needs.build-binaries.result == 'failure')
    steps:
      # Both ids are read through env rather than interpolated into the script
      # body: when create-release fails they are empty, and an empty expression
      # spliced into the source produced a SyntaxError that masked the real error.
      - name: Delete release
        if: needs.create-release.outputs.release_id != ''
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            try {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: parseInt(process.env.RELEASE_ID, 10)
              });
              console.log('Release deleted');
            } catch (e) {
              console.log('Failed to delete release:', e.message);
            }

      - name: Delete tag
        if: needs.create-release.outputs.version != ''
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/v${process.env.VERSION}`
              });
              console.log('Tag deleted');
            } catch (e) {
              console.log('Failed to delete tag:', e.message);
            }

  # The counterpart to cleanup-on-failure: the release survived, so say what is
  # sitting there and how to get rid of it, rather than leaving an unexplained
  # draft and a version number that can no longer be dispatched.
  report-partial-release:
    name: "Report Partial Release"
    runs-on: ubuntu-latest
    needs: [create-release, build-binaries, build-docker, build-msi, finalize-release]
    if: |
      failure()
      && needs.create-release.result == 'success'
      && needs.build-binaries.result == 'success'
    steps:
      - name: Summarise what survived
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          DOCKER_RESULT: ${{ needs.build-docker.result }}
          MSI_RESULT: ${{ needs.build-msi.result }}
          FINALIZE_RESULT: ${{ needs.finalize-release.result }}
        run: |
          {
            echo "### Release v$VERSION kept as a draft"
            echo
            echo "Every platform binary built and uploaded, so the release was not deleted."
            echo
            echo "| Job | Result |"
            echo "| :-- | :-- |"
            echo "| Build Docker | $DOCKER_RESULT |"
            echo "| Build MSI | $MSI_RESULT |"
            echo "| Finalize Release | $FINALIZE_RESULT |"
            echo
            echo "Fix the failing job and publish the draft by hand, or free the version"
            echo "number up for another run with:"
            echo
            echo '```'
            echo "gh release delete v$VERSION --cleanup-tag --yes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::Release v$VERSION was left as a draft with its binaries intact. Tag v$VERSION is now taken - delete it before re-running this version."