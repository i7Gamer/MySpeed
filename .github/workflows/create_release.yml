name: Promote qualified release

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        required: true
        type: string
      qualification_run_attempt:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      windows_stamp:
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-and-registry
  cancel-in-progress: false

jobs:
  validate:
    name: Validate trusted qualification
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate qualification run provenance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RUN_ID: ${{ inputs.qualification_run_id }}
          RUN_ATTEMPT: ${{ inputs.qualification_run_attempt }}
          SOURCE_SHA: ${{ inputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OUTPUT_PATH: ${{ runner.temp }}/artifacts.json
        with:
          script: |
            const maxQualificationAgeMs = 7 * 24 * 60 * 60 * 1000;
            const runId = Number(process.env.RUN_ID);
            const attempt = Number(process.env.RUN_ATTEMPT);
            if (!Number.isSafeInteger(runId) || runId <= 0 || !Number.isSafeInteger(attempt) || attempt <= 0)
              throw new Error('Invalid qualification run identity');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId
            });
            const {data: branch} = await github.rest.repos.getBranch({owner: context.repo.owner,
              repo: context.repo.repo, branch: process.env.DEFAULT_BRANCH});
            if (context.ref !== 'refs/heads/' + process.env.DEFAULT_BRANCH || context.sha !== branch.commit.sha)
              throw new Error('Promotion workflow must be dispatched from the current trusted default-branch head');
            if (run.run_attempt !== attempt || run.event !== 'workflow_dispatch' || run.conclusion !== 'success')
              throw new Error('Qualification run or attempt is not a successful manual qualification');
            if (run.path !== '.github/workflows/qualify-release.yml' || run.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo)
              throw new Error('Qualification came from an untrusted workflow or repository');
            if (run.head_sha !== process.env.SOURCE_SHA || run.head_sha !== branch.commit.sha
              || run.head_branch !== process.env.DEFAULT_BRANCH)
              throw new Error('Qualification source is stale or is not the default-branch head');
            const createdAt = Date.parse(run.created_at);
            if (!Number.isFinite(createdAt) || Date.now() - createdAt > maxQualificationAgeMs)
              throw new Error('Qualification is expired');
            const fs = require('fs');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100
            });
            const mebibyte = 1024 * 1024;
            const gibibyte = 1024 * mebibyte;
            const expected = ['MySpeed-windows-x64.exe', 'MySpeed-windows-x64-baseline.exe',
              'MySpeed-linux-x64', 'MySpeed-linux-x64-baseline', 'MySpeed-linux-arm64',
              'MySpeed-macos-x64', 'MySpeed-macos-arm64', 'MySpeed.zip',
              'release-msi-MySpeed-installer.msi', 'release-msi-MySpeed-installer-baseline.msi',
              'release-static', 'qualified-oci-amd64', 'qualified-oci-arm64',
              'qualified-oci-index',
              'release-qualification-manifest'].sort();
            const names = artifacts.map(({name}) => name).sort();
            if (JSON.stringify(names) !== JSON.stringify(expected)) throw new Error('Actions artifact set mismatch');
            for (const artifact of artifacts) {
              const limit = artifact.name === 'release-static' || artifact.name === 'release-qualification-manifest'
                ? 10 * mebibyte : artifact.name === 'MySpeed.zip' ? 2 * gibibyte
                  : artifact.name.startsWith('qualified-oci-') ? 4 * gibibyte : gibibyte;
              if (artifact.expired || artifact.size_in_bytes <= 0 || artifact.size_in_bytes > limit
                || !/^sha256:[a-f0-9]{64}$/.test(artifact.digest))
                throw new Error('Unsafe Actions artifact metadata: ' + artifact.name);
            }
            fs.writeFileSync(process.env.OUTPUT_PATH, JSON.stringify({artifacts:
              artifacts.filter(({name}) => name !== 'release-qualification-manifest')}));

      - name: Checkout current trusted promotion logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up trusted validation runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install trusted validator dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download exact qualification artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}
          pattern: "*"
          path: ${{ runner.temp }}/artifacts

      - name: Revalidate every candidate byte with trusted code
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/artifacts
          ARTIFACT_METADATA: ${{ runner.temp }}/artifacts.json
          MANIFEST: ${{ runner.temp }}/artifacts/release-qualification-manifest/qualification-manifest.json
          EVIDENCE: ${{ runner.temp }}/evidence.json
          SOURCE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
          RUN_ID: ${{ inputs.qualification_run_id }}
          RUN_ATTEMPT: ${{ inputs.qualification_run_attempt }}
        run: |
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || {
            echo 'Trusted promotion validator checkout moved after provenance validation.' >&2
            exit 1
          }
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.env.MANIFEST));fs.writeFileSync(process.env.EVIDENCE,JSON.stringify(m.evidence))"
          node scripts/release/qualification-manifest.mjs validate \
            --root "$ARTIFACT_ROOT" --output "$RUNNER_TEMP/unused" --artifacts "$ARTIFACT_METADATA" \
            --evidence "$EVIDENCE" --manifest "$MANIFEST" --sha "$SOURCE_SHA" --version "$VERSION" \
            --windows-stamp "$WINDOWS_STAMP" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY"
          jq -e '.promotion.eligible == true' "$MANIFEST" >/dev/null || {
            echo 'Qualification is a rehearsal only; required native and MSI lifecycle evidence is missing.' >&2
            exit 1
          }

  create-draft:
    name: Create immutable tag and draft
    needs: validate
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      actions: read
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Download sealed qualification manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}
          name: release-qualification-manifest
          path: ${{ runner.temp }}/qualification

      - name: Revalidate promotion immediately before mutation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MANIFEST: ${{ runner.temp }}/qualification/qualification-manifest.json
          RUN_ID: ${{ inputs.qualification_run_id }}
          RUN_ATTEMPT: ${{ inputs.qualification_run_attempt }}
          SOURCE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const fs = require('fs'); const {createHash} = require('crypto');
            const maxAgeMs = 7 * 24 * 60 * 60 * 1000; const maxManifestBytes = 10 * 1024 * 1024;
            const bytes = fs.readFileSync(process.env.MANIFEST); const stat = fs.lstatSync(process.env.MANIFEST);
            if (!stat.isFile() || stat.nlink !== 1 || stat.size === 0 || stat.size > maxManifestBytes) throw new Error('Unsafe qualification manifest');
            const sealed = fs.readFileSync(process.env.MANIFEST + '.sha256', 'utf8').trim();
            if (!/^[a-f0-9]{64}$/.test(sealed) || createHash('sha256').update(bytes).digest('hex') !== sealed) throw new Error('Qualification manifest seal mismatch');
            const manifest = JSON.parse(bytes); const runId = Number(process.env.RUN_ID); const attempt = Number(process.env.RUN_ATTEMPT);
            if (manifest.run.id !== runId || manifest.run.attempt !== attempt || manifest.source.sha !== process.env.SOURCE_SHA
              || manifest.source.version !== process.env.VERSION || manifest.source.windowsStamp !== process.env.WINDOWS_STAMP
              || manifest.promotion.eligible !== true || manifest.promotion.blockers?.length !== 0) throw new Error('Qualification is not promotion eligible');
            const {data: run} = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: runId});
            const {data: branch} = await github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: process.env.DEFAULT_BRANCH});
            const createdAt = Date.parse(run.created_at);
            if (context.ref !== 'refs/heads/' + process.env.DEFAULT_BRANCH || branch.commit.sha !== process.env.SOURCE_SHA
              || run.run_attempt !== attempt || run.event !== 'workflow_dispatch' || run.conclusion !== 'success'
              || run.path !== '.github/workflows/qualify-release.yml' || run.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo
              || run.head_sha !== process.env.SOURCE_SHA || run.head_branch !== process.env.DEFAULT_BRANCH
              || !Number.isFinite(createdAt) || Date.now() - createdAt > maxAgeMs) throw new Error('Qualification is stale or untrusted');

      - name: Create tag and draft release
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const versionPattern = /^\d+\.\d+\.\d+$/;
            if (!versionPattern.test(process.env.VERSION) || !/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA))
              throw new Error('Invalid qualified release identity');
            const tag = 'v' + process.env.VERSION;
            for (const lookup of [
              () => github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'tags/' + tag}),
              () => github.rest.repos.getReleaseByTag({owner: context.repo.owner, repo: context.repo.repo, tag})
            ]) try { await lookup(); throw new Error(tag + ' already exists'); } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.git.createRef({owner: context.repo.owner, repo: context.repo.repo,
              ref: 'refs/tags/' + tag, sha: process.env.SOURCE_SHA});
            const {data: release} = await github.rest.repos.createRelease({owner: context.repo.owner,
              repo: context.repo.repo, tag_name: tag, name: tag, draft: true, prerelease: false});
            core.setOutput('id', release.id);

  publish-assets:
    name: Attach exact qualified assets
    needs: [validate, create-draft]
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download exact qualification artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}
          pattern: "*"
          path: ${{ runner.temp }}/artifacts

      - name: Revalidate promotion immediately before mutation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MANIFEST: ${{ runner.temp }}/artifacts/release-qualification-manifest/qualification-manifest.json
          RUN_ID: ${{ inputs.qualification_run_id }}
          RUN_ATTEMPT: ${{ inputs.qualification_run_attempt }}
          SOURCE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const fs = require('fs'); const {createHash} = require('crypto');
            const maxAgeMs = 7 * 24 * 60 * 60 * 1000; const maxManifestBytes = 10 * 1024 * 1024;
            const bytes = fs.readFileSync(process.env.MANIFEST); const stat = fs.lstatSync(process.env.MANIFEST);
            if (!stat.isFile() || stat.nlink !== 1 || stat.size === 0 || stat.size > maxManifestBytes) throw new Error('Unsafe qualification manifest');
            const sealed = fs.readFileSync(process.env.MANIFEST + '.sha256', 'utf8').trim();
            if (!/^[a-f0-9]{64}$/.test(sealed) || createHash('sha256').update(bytes).digest('hex') !== sealed) throw new Error('Qualification manifest seal mismatch');
            const manifest = JSON.parse(bytes); const runId = Number(process.env.RUN_ID); const attempt = Number(process.env.RUN_ATTEMPT);
            if (manifest.run.id !== runId || manifest.run.attempt !== attempt || manifest.source.sha !== process.env.SOURCE_SHA
              || manifest.source.version !== process.env.VERSION || manifest.source.windowsStamp !== process.env.WINDOWS_STAMP
              || manifest.promotion.eligible !== true || manifest.promotion.blockers?.length !== 0) throw new Error('Qualification is not promotion eligible');
            const {data: run} = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: runId});
            const {data: branch} = await github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: process.env.DEFAULT_BRANCH});
            const createdAt = Date.parse(run.created_at);
            if (context.ref !== 'refs/heads/' + process.env.DEFAULT_BRANCH || branch.commit.sha !== process.env.SOURCE_SHA
              || run.run_attempt !== attempt || run.event !== 'workflow_dispatch' || run.conclusion !== 'success'
              || run.path !== '.github/workflows/qualify-release.yml' || run.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo
              || run.head_sha !== process.env.SOURCE_SHA || run.head_branch !== process.env.DEFAULT_BRANCH
              || !Number.isFinite(createdAt) || Date.now() - createdAt > maxAgeMs) throw new Error('Qualification is stale or untrusted');

      - name: Upload fixed validated release payloads
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ROOT: ${{ runner.temp }}/artifacts
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {createHash} = require('crypto');
            const manifestPath = path.join(process.env.ROOT, 'release-qualification-manifest', 'qualification-manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath));
            const assets = manifest.releaseAssets;
            for (const asset of assets) {
              if (!/^[A-Za-z0-9_.-]+$/.test(asset.artifact) || !/^[A-Za-z0-9_.-]+$/.test(asset.path) || !/^[A-Za-z0-9_.-]+$/.test(asset.name))
                throw new Error('Unsafe release asset name');
              const file = path.join(process.env.ROOT, asset.artifact, asset.path);
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.nlink !== 1 || stat.size !== asset.size || stat.size === 0)
                throw new Error('Invalid release asset: ' + asset.name);
              const actual = createHash('sha256').update(fs.readFileSync(file)).digest('hex');
              if (actual !== asset.sha256) throw new Error('Release asset digest mismatch: ' + asset.name);
            }
            for (const asset of assets) await github.rest.repos.uploadReleaseAsset({owner: context.repo.owner,
              repo: context.repo.repo, release_id: Number(process.env.RELEASE_ID), name: asset.name,
              data: fs.readFileSync(path.join(process.env.ROOT, asset.artifact, asset.path))});
            for (const name of ['SHA256SUMS', 'qualification-manifest.json', 'qualification-manifest.json.sha256']) await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner, repo: context.repo.repo, release_id: Number(process.env.RELEASE_ID),
              name, data: fs.readFileSync(path.join(process.env.ROOT, 'release-qualification-manifest', name))});

  publish-docker:
    name: Publish exact qualified containers
    needs: [validate, create-draft, publish-assets]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/publish-docker.yml
    with:
      qualification_run_id: ${{ inputs.qualification_run_id }}
      qualification_run_attempt: ${{ inputs.qualification_run_attempt }}
      candidate_sha: ${{ inputs.candidate_sha }}
      version: ${{ inputs.version }}
      windows_stamp: ${{ inputs.windows_stamp }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  finalize-release:
    name: Publish release
    needs: [create-draft, publish-assets, publish-docker]
    permissions:
      contents: write
    uses: ./.github/workflows/finalize-release.yml
    with:
      release_id: ${{ needs.create-draft.outputs.release_id }}
      qualification_run_id: ${{ inputs.qualification_run_id }}
      qualification_run_attempt: ${{ inputs.qualification_run_attempt }}
      candidate_sha: ${{ inputs.candidate_sha }}
      version: ${{ inputs.version }}
      windows_stamp: ${{ inputs.windows_stamp }}

  report-failure:
    name: Preserve and report partial promotion
    if: ${{ failure() }}
    needs: [validate, create-draft, publish-assets, publish-docker, finalize-release]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report forensic state
        env:
          VERSION: ${{ inputs.version }}
        run: echo "::error::Promotion of v$VERSION failed. Qualified artifacts and any draft release are preserved for review."
