name: Prepare post-release v1.6.1 MSI evidence

# The preparation-only dispatch path is unchanged. `workflow_call` lets the MSI lifecycle workflow
# run this exact preparation as a job of its own run, so the artifact it uploads carries that run's
# id, attempt and head SHA - which is what the Linux execution job binds before it observes it.
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_id:
        description: Artifact id of the nonqualifying preparation bundle
        value: ${{ jobs.prepare.outputs.artifact_id }}

permissions:
  actions: read
  contents: read

env:
  CANDIDATE_SOURCE_SHA: 4fa4dd40a89a062735f98bd85d685e0624ff46a8

jobs:
  prepare:
    if: github.repository == 'i7Gamer/MySpeed'
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact harness source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout exact candidate fixture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          path: candidate-source
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Build exact candidate fixture source
        working-directory: candidate-source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Candidate fixture dependency installation failed' }
          node scripts/generate-migrations.js
          if ($LASTEXITCODE -ne 0) { throw 'Candidate migration registry generation failed' }
          node scripts/generate-integrations.js
          if ($LASTEXITCODE -ne 0) { throw 'Candidate integration registry generation failed' }

      - name: Capture immutable published target metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CAPTURE_PATH: ${{ runner.temp }}\post-release-msi-captured.json
        with:
          script: |
            const fs = require('node:fs');
            const owner = 'i7Gamer'; const repo = 'MySpeed';
            const [{data: tag}, {data: run}, {data: artifact}, {data: release}] = await Promise.all([
              github.rest.git.getRef({owner, repo, ref: 'tags/v1.6.1'}),
              github.rest.actions.getWorkflowRun({owner, repo, run_id: 34829932391}),
              github.rest.actions.getArtifact({owner, repo, artifact_id: 10342345489}),
              github.rest.repos.getReleaseByTag({owner, repo, tag: 'v1.6.1'})
            ]);
            const captured = {
              tag: {repository: `${owner}/${repo}`, name: 'v1.6.1', commitSha: tag.object.sha},
              qualificationRun: {repository: `${owner}/${repo}`, id: run.id, attempt: run.run_attempt,
                headSha: run.head_sha, event: run.event, status: run.status, conclusion: run.conclusion,
                workflowName: run.name, createdAt: run.created_at, updatedAt: run.updated_at},
              qualificationArchive: {repository: `${owner}/${repo}`, id: artifact.id, name: artifact.name,
                size: artifact.size_in_bytes, digest: artifact.digest, expired: artifact.expired,
                createdAt: artifact.created_at, updatedAt: artifact.updated_at, expiresAt: artifact.expires_at,
                runId: artifact.workflow_run?.id, runAttempt: run.run_attempt,
                headSha: artifact.workflow_run?.head_sha},
              release: {repository: `${owner}/${repo}`, id: release.id, tagName: release.tag_name,
                targetCommitish: release.target_commitish, createdAt: release.created_at,
                publishedAt: release.published_at, draft: release.draft, prerelease: release.prerelease,
                platformImmutable: release.immutable, assets: release.assets.map(asset => ({id: asset.id,
                  name: asset.name, size: asset.size, digest: asset.digest, state: asset.state,
                  url: asset.browser_download_url, createdAt: asset.created_at, updatedAt: asset.updated_at}))}
            };
            fs.writeFileSync(process.env.CAPTURE_PATH, JSON.stringify(captured), {flag: 'wx'});

      - name: Acquire exact published qualification manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'qualification-manifest.json'
          Invoke-WebRequest -Uri 'https://github.com/i7Gamer/MySpeed/releases/download/v1.6.1/qualification-manifest.json' `
            -OutFile $path -UseBasicParsing
          $item = Get-Item -LiteralPath $path -Force
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($item.Length -ne 21518 -or $hash -cne '7339a6446d048bbae93759734bcafc94208e2b847af15677e847ae9a4b2f8bca') {
            throw 'Published qualification manifest differs'
          }

      - name: Acquire authenticated portable WiX
        shell: pwsh
        env:
          WIX_URL: https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          WIX_SHA256: 6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $maximumArchiveBytes = 134217728
          $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'wix314-binaries'
          if ((Test-Path -LiteralPath $archive) -or (Test-Path -LiteralPath $directory)) {
            throw 'WiX staging collision'
          }
          Invoke-WebRequest -Uri $env:WIX_URL -OutFile $archive -UseBasicParsing
          $archiveInfo = Get-Item -LiteralPath $archive -Force -ErrorAction Stop
          if ($archiveInfo.PSIsContainer -or ($archiveInfo.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
            $archiveInfo.Length -le 0 -or $archiveInfo.Length -gt $maximumArchiveBytes) {
            throw 'WiX archive is not an ordinary bounded file'
          }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:WIX_SHA256) { throw 'WiX archive digest differs' }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory -ErrorAction Stop
          foreach ($name in @('dark.exe','candle.exe','light.exe')) {
            $tool = Join-Path $directory $name
            $item = Get-Item -LiteralPath $tool -Force -ErrorAction Stop
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
              $item.Length -le 0) { throw "WiX tool $name differs" }
          }

      - name: Acquire and inspect exact MSI preparation inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'post-release-msi-preparation'
          $files = Join-Path $bundle 'files'
          $fixtures = Join-Path $files 'fixtures'
          $fixtureWork = Join-Path $env:RUNNER_TEMP 'post-release-msi-fixture-work'
          $wix = Join-Path $env:RUNNER_TEMP 'wix314-binaries'
          $result = Join-Path $bundle 'result.json'
          $fixtureProof = Join-Path $bundle 'fixture-proof.json'
          $baselineProof = Join-Path $bundle 'baseline-proof.json'
          $baselineSource = Join-Path $env:RUNNER_TEMP 'post-release-msi-baseline-source'
          if (Test-Path -LiteralPath $baselineSource) { throw 'Candidate fixture source staging collision' }
          [void][IO.Directory]::CreateDirectory($baselineSource)
          [void][IO.Directory]::CreateDirectory((Join-Path $baselineSource 'populated'))
          [void][IO.Directory]::CreateDirectory((Join-Path $baselineSource 'reset'))
          $candidateRoot = [IO.Path]::GetFullPath((Join-Path $PWD 'candidate-source'))
          node candidate-source/scripts/qualification/fixture.mjs handoff --repo $candidateRoot `
            --work (Join-Path $baselineSource 'populated') --reset-work (Join-Path $baselineSource 'reset') `
            --manifest (Join-Path $baselineSource 'transport.json') --source-sha $env:CANDIDATE_SOURCE_SHA | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Candidate fixture source preparation failed' }
          $pwsh = (Get-Command pwsh -CommandType Application -ErrorAction Stop).Source
          node scripts/release/post-release-msi-prepare-controller.mjs `
            --captured (Join-Path $env:RUNNER_TEMP 'post-release-msi-captured.json') `
            --manifest (Join-Path $env:RUNNER_TEMP 'qualification-manifest.json') `
            --root $files --fixture-root $fixtures --fixture-work $fixtureWork `
            --wix-dark (Join-Path $wix 'dark.exe') --wix-candle (Join-Path $wix 'candle.exe') `
            --wix-light (Join-Path $wix 'light.exe') --fixture-proof $fixtureProof `
            --baseline-source $baselineSource --baseline-proof $baselineProof `
            --output $result --pwsh $pwsh
          if ($LASTEXITCODE -ne 0) { throw 'Hosted MSI preparation failed' }

      - name: Upload nonqualifying preparation artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: post-release-v1.6.1-msi-appassets
          path: ${{ runner.temp }}\post-release-msi-preparation
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
