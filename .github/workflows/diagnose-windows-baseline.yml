# TEMPORARY. Delete once the Windows baseline compile is fixed.
#
# build-binaries.yml only runs on a release dispatch, so the only way to learn
# anything about this failure has been to spend a release on it - three so far,
# each tearing down its own tag and draft while the Docker jobs had already
# pushed :latest. This does the same compile with nothing else attached.
#
# It compiles a one-line file rather than the server: the bundle has never been
# the problem (921 modules, clean, every time), so the only thing under test
# here is fetching and extracting the baseline runtime.
name: Diagnose Windows baseline compile

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: "Diagnose"
    runs-on: windows-latest

    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Where everything lives
        shell: pwsh
        run: |
          "bun version : $(bun --version)"
          "bun binary  : $((Get-Command bun).Source)"
          "HOME        : $HOME"
          "USERPROFILE : $env:USERPROFILE"
          "BUN_INSTALL : $env:BUN_INSTALL"
          ""
          "free space on the working drive:"
          Get-PSDrive -Name (Get-Location).Drive.Name | Select-Object Name, Used, Free | Format-Table -AutoSize
          ""
          "Defender:"
          try {
            Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled,
              IoavProtectionEnabled, OnAccessProtectionEnabled | Format-List
          } catch { "Get-MpComputerStatus unavailable: $_" }

      - name: Control - the default target, which needs no runtime download
        shell: pwsh
        continue-on-error: true
        run: |
          'console.log("hi")' | Out-File -Encoding ascii tiny.js
          bun build --compile --target=bun-windows-x64 tiny.js --outfile out-default.exe
          "exit=$LASTEXITCODE"

      - name: The failing case, on its own
        shell: pwsh
        continue-on-error: true
        run: |
          bun build --compile --target=bun-windows-x64-baseline tiny.js --outfile out-baseline.exe
          "exit=$LASTEXITCODE"

      # If bun downloaded anything at all, it is here - and its size says
      # whether "the download may be incomplete" is describing what happened.
      - name: What bun left behind
        shell: pwsh
        run: |
          foreach ($root in @("$HOME/.bun", "$env:USERPROFILE/.bun", "$env:BUN_INSTALL")) {
            if (-not $root -or -not (Test-Path $root)) { "$root - absent"; continue }
            "--- $root ---"
            Get-ChildItem $root -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match "baseline|\.zip$|\.tmp$" } |
              Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize
          }

      # Can this runner fetch and unpack that artifact at all, using tools with
      # their own retry and their own extractor? If this works, the fetch is
      # fine and bun's own extract step is what fails.
      - name: Fetch and extract the runtime by hand
        shell: pwsh
        continue-on-error: true
        run: |
          $version = bun --version
          $url = "https://github.com/oven-sh/bun/releases/download/bun-v$version/bun-windows-x64-baseline.zip"
          "GET $url"

          curl.exe -sSL --retry 3 --fail -o runtime.zip $url
          "curl exit  : $LASTEXITCODE"
          "size       : $((Get-Item runtime.zip -ErrorAction SilentlyContinue).Length)"

          Expand-Archive runtime.zip -DestinationPath extracted -Force
          "expand exit: $LASTEXITCODE"
          Get-ChildItem extracted -Recurse -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Anything Defender took exception to
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $threats = Get-MpThreatDetection -ErrorAction Stop
            if ($threats) { $threats | Select-Object -First 10 | Format-List } else { "no detections recorded" }
          } catch { "Get-MpThreatDetection unavailable: $_" }

      # Candidate fix 1: keep Defender away from the directory bun extracts into.
      - name: Retry with a Defender exclusion
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Add-MpPreference -ExclusionPath "$HOME\.bun" -ErrorAction Stop
            "exclusion added"
          } catch { "could not add exclusion: $_" }

          Remove-Item "$HOME/.bun/install/cache/bun-windows-x64-baseline-v*" -Recurse -Force -ErrorAction SilentlyContinue
          bun build --compile --target=bun-windows-x64-baseline tiny.js --outfile out-excluded.exe
          "exit=$LASTEXITCODE"

      # Candidate fix 2: make the host runtime the baseline one, so the compile
      # has nothing to fetch - which is exactly why the default leg never fails.
      - name: Retry with a baseline Bun as the host runtime
        shell: pwsh
        continue-on-error: true
        run: |
          $version = bun --version
          $url = "https://github.com/oven-sh/bun/releases/download/bun-v$version/bun-windows-x64-baseline.zip"

          curl.exe -sSL --retry 3 --fail -o baseline.zip $url
          Expand-Archive baseline.zip -DestinationPath baseline-bun -Force

          $exe = (Get-ChildItem baseline-bun -Recurse -Filter bun.exe | Select-Object -First 1).FullName
          "baseline bun: $exe"
          & $exe --version

          Remove-Item "$HOME/.bun/install/cache/bun-windows-x64-baseline-v*" -Recurse -Force -ErrorAction SilentlyContinue
          & $exe build --compile --target=bun-windows-x64-baseline tiny.js --outfile out-hostbaseline.exe
          "exit=$LASTEXITCODE"

      - name: What compiled
        shell: pwsh
        run: |
          Get-ChildItem out-*.exe -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Format-Table -AutoSize
          if (-not (Test-Path out-*.exe)) { "nothing compiled" }
