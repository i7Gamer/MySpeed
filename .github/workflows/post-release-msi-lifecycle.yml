      # Only the rollback calibration is assembled here. Its producer ran in another run, at another
      # commit, so its retained documents are the only way this job can have it. The IFEO containment
      # prerequisite is the opposite: it means nothing unless this run's own guest produced it, so the
      # controller runs the containment preflight on a disposable overlay of the installed base it
      # just sealed and binds the record that produced. Demanding it here, before invoking the thing
      # that creates it, is what used to stop every run.
      - name: Assemble the typed prerequisite evidence
        if: inputs.calibration_mode != 'true'
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/myspeed-msi-input-$EXPECTED_NONCE"
          closure_root="$RUNNER_TEMP/myspeed-msi-closure-$EXPECTED_NONCE"
          node --input-type=module - "$input_root" "$closure_root" <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import {pathToFileURL} from "node:url";
          const [inputRoot, closureRoot] = process.argv.slice(2);
          const {inspectWindowsMsiPrerequisiteEvidence} = await import(pathToFileURL(
            path.join(closureRoot, "scripts/qualification/windows-msi-prerequisite-evidence.mjs")).href);
          const retained = target => { const bytes = fs.readFileSync(target);
            return {bytes: String(bytes.length),
              sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
              bytesBase64: bytes.toString("base64")}; };
          const text = target => fs.readFileSync(target, "utf8").trim();
          const records = {
            rollbackCalibration: {schemaVersion: 1, kind: "myspeed-windows-msi-prerequisite-evidence",
              prerequisiteId: "msi-api-rollback-controller", producer: "hosted-run-artifact",
              provenance: {repository: process.env.GITHUB_REPOSITORY,
                workflow: process.env.ROLLBACK_WORKFLOW, runId: process.env.ROLLBACK_RUN_ID,
                runAttempt: process.env.ROLLBACK_RUN_ATTEMPT, sourceSha: process.env.ROLLBACK_SOURCE_SHA,
                /*
                 * The producer's event SHA is its own and differs from its source SHA; it is read
                 * back from the platform rather than assumed equal to anything this run has.
                 */
                eventSha: text(path.join(inputRoot, "rollback-producer-event-sha.txt")),
                artifactId: process.env.ROLLBACK_ARTIFACT_ID,
                artifactName: process.env.ROLLBACK_ARTIFACT_NAME,
                artifactBytes: process.env.ROLLBACK_ARCHIVE_BYTES,
                artifactDigest: `sha256:${process.env.ROLLBACK_ARCHIVE_SHA256}`,
                officialArtifactDigest: text(path.join(inputRoot, "rollback-official-digest.txt"))},
              document: retained(path.join(inputRoot, "rollback-result.json")),
              launch: retained(path.join(inputRoot, "rollback-launcher.json"))}};
          /*
           * Replayed here, on its own, rather than merely copied forward: a record that the matrix
           * would later refuse must fail before a guest is ever started.
           */
          inspectWindowsMsiPrerequisiteEvidence({name: "rollbackCalibration",
            value: records.rollbackCalibration, context: {
              repository: process.env.GITHUB_REPOSITORY, sourceSha: process.env.EXPECTED_SOURCE_SHA,
              eventSha: process.env.EXPECTED_EVENT_SHA, runId: process.env.EXPECTED_RUN_ID,
              runAttempt: process.env.EXPECTED_RUN_ATTEMPT, nonce: process.env.EXPECTED_NONCE}});
          fs.writeFileSync(path.join(inputRoot, "prerequisite-evidence.json"),
            `${JSON.stringify(records)}\n`, {flag: "wx", mode: 0o600});
          NODE

      - name: Seal the installed base and run the exact fourteen rows
        id: lifecycle
        shell: bash
        run: |
          set -euo pipefail
          closure_root="$RUNNER_TEMP/myspeed-msi-closure-$EXPECTED_NONCE"
          input_root="$RUNNER_TEMP/myspeed-msi-input-$EXPECTED_NONCE"
          task_root="$RUNNER_TEMP/myspeed-windows-msi-$EXPECTED_NONCE"
          transport_root="$RUNNER_TEMP/myspeed-msi-transport-$EXPECTED_NONCE"
          install -m 600 /dev/null "$transport_root/controller.stdout"
          install -m 600 /dev/null "$transport_root/controller.stderr"
          started="$(cat "$RUNNER_TEMP/msi-job-start")"
          elapsed=$(( $(date -u +%s) - started ))
          node --input-type=module - "$closure_root" "$input_root" "$task_root" "$elapsed" \
            "$task_root/msi-lifecycle-request.json" <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import {pathToFileURL} from "node:url";
          const [closureRoot, inputRoot, taskRoot, elapsedText, output] = process.argv.slice(2);
          const {admitWindowsMsiLifecycleSetup} = await import(pathToFileURL(path.join(closureRoot,
            "scripts/qualification/windows-msi-lifecycle-budget.mjs")).href);
          const minute = 60_000;
          const hash = bytes => crypto.createHash("sha256").update(bytes).digest("hex");
          const identity = target => { const bytes = fs.readFileSync(target);
            return {path: target, bytes: bytes.length, sha256: hash(bytes)}; };
          const integerMinutes = (value, name) => { if (!/^[1-9][0-9]{0,3}$/u.test(value ?? ""))
            throw new Error(`${name} is invalid`); return Number(value) * minute; };
          const elapsed = Number(elapsedText) * 1000;
          if (!Number.isSafeInteger(elapsed) || elapsed < 0) throw new Error("measured setup is invalid");
          /*
           * Setup - Stage 2 above all - was charged to this same job, so the matrix only gets what is
           * left of the dispatched budget. A remainder that cannot hold one row with its margins is
           * refused here by the same module the controller admits rows with.
           */
          const budget = admitWindowsMsiLifecycleSetup({elapsedMilliseconds: elapsed,
            job: {jobBudgetMilliseconds: integerMinutes(process.env.JOB_BUDGET_MINUTES, "job budget"),
              jobTimeoutMilliseconds: integerMinutes(process.env.JOB_TIMEOUT_MINUTES, "job timeout"),
              retentionReserveMilliseconds: integerMinutes(process.env.RETENTION_RESERVE_MINUTES,
                "retention reserve")},
            limits: {rowAllowanceMilliseconds: integerMinutes(process.env.ROW_ALLOWANCE_MINUTES,
              "row allowance"),
            rowCleanupMarginMilliseconds: integerMinutes(process.env.ROW_CLEANUP_MARGIN_MINUTES,
              "row cleanup margin"),
            finalMarginMilliseconds: integerMinutes(process.env.FINAL_MARGIN_MINUTES, "final margin")}});
          const stage2Result = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/myspeed-msi-transport-${process.env.EXPECTED_NONCE}/stage2-result.json`));
          const root = `${process.env.RUNNER_TEMP}/myspeed-windows-cpu-floor-${process.env.EXPECTED_NONCE}`;
          const isCalibration = process.env.CALIBRATION_MODE === "true";
          const request = {mode: isCalibration ? "scenario0-calibration" : "full-matrix",
            context: {schemaVersion: 1, repository: process.env.GITHUB_REPOSITORY,
            sourceSha: process.env.EXPECTED_SOURCE_SHA, eventSha: process.env.EXPECTED_EVENT_SHA,
            runId: process.env.EXPECTED_RUN_ID, runAttempt: process.env.EXPECTED_RUN_ATTEMPT,
            nonce: process.env.EXPECTED_NONCE, environment: {GITHUB_ACTIONS: process.env.GITHUB_ACTIONS,
              CI: process.env.CI, RUNNER_OS: process.env.RUNNER_OS, RUNNER_ARCH: process.env.RUNNER_ARCH,
              RUNNER_ENVIRONMENT: process.env.RUNNER_ENVIRONMENT, ImageOS: process.env.ImageOS,
              ImageVersion: process.env.ImageVersion}},
          taskRoot, artifactRoot: `${taskRoot}/appassets`,
          artifact: JSON.parse(fs.readFileSync(path.join(inputRoot, "preparation-artifact.json"))),
          closureRoot, stage2Paths: {root, packageRoot: `${root}/packages`,
            portableRoot: `/tmp/myspeed-windows-cpu-floor-tools-${process.env.EXPECTED_NONCE}`,
            probeRoot: `${root}/probes`, windowsIso: `${root}/windows.iso`,
            installWim: `${root}/install.wim`, seedIso: `${root}/seed.iso`,
            outputDisk: `${root}/output.img`, systemDisk: `${root}/system.qcow2`,
            ovmfVars: `${root}/OVMF_VARS.fd`, serialLog: `${root}/serial.log`, qemuPid: `${root}/qemu.pid`},
          stage2Result, installedBaseHelperSource: (() => { const observed = identity(path.join(closureRoot,
            "scripts/qualification/windows-msi-installed-base-seal-helper.mjs"));
          return {path: observed.path, bytes: observed.bytes, sha256: observed.sha256}; })(),
          ...(isCalibration ? {} : {prerequisiteEvidence: JSON.parse(fs.readFileSync(path.join(inputRoot, "prerequisite-evidence.json")))}),
          budget, wallDeadlineUnixMilliseconds: Date.now() + budget.jobBudgetMilliseconds};
          fs.writeFileSync(output, `${JSON.stringify(request)}\n`, {flag: "wx", mode: 0o600});
          NODE
          set +e
          node "$closure_root/scripts/release/post-release-msi-linux-controller.mjs" run \
            --request "$task_root/msi-lifecycle-request.json" \
            --result "$task_root/msi-lifecycle-result.json" \
            --progress "$task_root/msi-lifecycle-progress.json" \
            --host-request "$task_root/msi-host-request.json" \
            >"$transport_root/controller.stdout" 2>"$transport_root/controller.stderr"
          controller_exit=$?
          set -e
          printf 'controller_exit=%s\n' "$controller_exit" >> "$GITHUB_OUTPUT"

      # Retained evidence is bounded text only, in the exact inventory the consumer requires:
      # `msi-host-request.json` and `msi-lifecycle-result.json` on a completed matrix, with the typed
      # progress, the two bounded streams, the closure manifest and the inventory itself alongside.
      # Progress is diagnostic and never stands in for a completed result: it carries scenario ids, a
      # budget observation and a bounded failure record, not the raw per-row proofs a replay needs.
      # Never installation media, a raw or qcow2 disk, a secret, or an unconstrained directory tree.
      - name: Bound the retained text evidence
        id: bound
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          transport_root="$RUNNER_TEMP/myspeed-msi-transport-$EXPECTED_NONCE"
          task_root="$RUNNER_TEMP/myspeed-windows-msi-$EXPECTED_NONCE"
          install -d -m 700 "$transport_root"
          for stream in controller.stdout controller.stderr; do
            test -e "$transport_root/$stream" || install -m 600 /dev/null "$transport_root/$stream"
            test -f "$transport_root/$stream" -a ! -L "$transport_root/$stream"
            test "$(stat -c %s -- "$transport_root/$stream")" -le 1048576
          done
          # The closure manifest is retained evidence like any other member, so it is copied into
          # the transport root and hashed into the inventory rather than uploaded from beside it.
          install -m 600 "$RUNNER_TEMP/myspeed-msi-closure-$EXPECTED_NONCE/msi-execution-closure.json" \
            "$transport_root/msi-execution-closure.json"
          for name in msi-host-request.json msi-lifecycle-result.json msi-lifecycle-progress.json; do
            if [ -e "$task_root/$name" ]; then
              test -f "$task_root/$name" -a ! -L "$task_root/$name"
              test "$(stat -c %s -- "$task_root/$name")" -le 16777216
              install -m 600 "$task_root/$name" "$transport_root/$name"
            fi
          done
          node --input-type=module - "$transport_root" "${{ steps.lifecycle.outputs.controller_exit }}" \
            "$RUNNER_TEMP/myspeed-msi-closure-$EXPECTED_NONCE" <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import {pathToFileURL} from "node:url";
          const [root, exitText, closureRoot] = process.argv.slice(2);
          const digest = bytes => crypto.createHash("sha256").update(bytes).digest("hex");
          const streams = ["controller.stdout", "controller.stderr"].map(name => {
            const bytes = fs.readFileSync(path.join(root, name));
            return {name, bytes: bytes.length, sha256: digest(bytes)}; });
          const exit = /^(0|1)$/u.test(exitText ?? "") ? Number(exitText) : null;
          const read = name => { const target = path.join(root, name);
            if (!fs.existsSync(target)) return {identity: null, value: null};
            const bytes = fs.readFileSync(target);
            let value = null;
            try { const parsed = JSON.parse(bytes.toString("utf8"));
              if (bytes.equals(Buffer.from(`${JSON.stringify(parsed)}\n`))) value = parsed; } catch { }
            return {identity: {bytes: bytes.length, sha256: digest(bytes)}, value}; };
          const result = read("msi-lifecycle-result.json");
          const progress = read("msi-lifecycle-progress.json");
          const hostRequest = read("msi-host-request.json");
          const value = result.value;
          /*
           * A completed matrix is only acceptable with the final host request beside it: without that
           * document nobody can replay the result against the request it was produced from.
           */
          const isCalibration = process.env.CALIBRATION_MODE === "true";
          /*
           * The calibration result is accepted by the production consumer or not at all. A summary
           * shape can be written by anything; only the module that knows the contract can say whether
           * these exact retained bytes replay against the exact request they were produced from, and
           * it is handed both documents as they were read back, not a projection of them.
           */
          let calibrationAccepted = false;
          if (isCalibration && exit === 0 && value !== null && hostRequest.value !== null) {
            try {
              const {validateCompletedWindowsMsiScenario0CalibrationResult} = await import(
                pathToFileURL(path.join(closureRoot,
                  "scripts/qualification/windows-msi-scenario0-calibration.mjs")).href);
              validateCompletedWindowsMsiScenario0CalibrationResult(value, hostRequest.value);
              calibrationAccepted = true;
            } catch (error) {
              process.stderr.write(`scenario0 calibration result refused: ${error.message}\n`);
            }
          }
          const accepted = exit === 0 && (isCalibration
            ? calibrationAccepted
            : (value?.schemaVersion === 1 && value.qualifying === false &&
              value.status === "completed" && JSON.stringify(value.releaseGatesCleared) === "[]" &&
              Array.isArray(value.hostRows) && value.hostRows.length === 14 &&
              value.budget?.status === "completed" && value.budget.rowsCompleted === 14 &&
              hostRequest.identity !== null));
          const summary = {schemaVersion: 1, kind: "myspeed-windows-msi-lifecycle-transport-summary",
            status: "observed", qualifying: false, releaseGatesCleared: [], controllerExit: exit,
            resultPresent: result.identity !== null, result: result.identity,
            progressPresent: progress.identity !== null, progress: progress.identity,
            rowsCompleted: isCalibration
              ? (calibrationAccepted ? 1 : 0)
              : (value?.budget?.rowsCompleted ?? progress.value?.budget?.rowsCompleted ?? null),
            refusedScenarioIndex: progress.value?.refusedScenarioIndex ?? null, streams, accepted,
            hostRequestPresent: hostRequest.identity !== null, hostRequest: hostRequest.identity};
          fs.writeFileSync(path.join(root, "transport-summary.json"), `${JSON.stringify(summary)}\n`,
            {flag: "wx", mode: 0o600});
          /*
           * The inventory names every retained member with the length and digest of its raw bytes, so
           * a consumer can bind what it received to what this job wrote without reparsing any of it.
           */
          const inventory = ["msi-host-request.json", "msi-lifecycle-result.json",
            "msi-lifecycle-progress.json", "transport-summary.json", "msi-execution-closure.json",
            "controller.stdout", "controller.stderr"].flatMap(name => { const target = path.join(root, name);
            if (!fs.existsSync(target)) return [];
            const bytes = fs.readFileSync(target);
            return [{name, bytes: String(bytes.length), sha256: digest(bytes)}]; });
          fs.writeFileSync(path.join(root, "evidence-manifest.json"), `${JSON.stringify(
            {schemaVersion: 1, kind: "myspeed-windows-msi-lifecycle-evidence-manifest", status: "observed",
              qualifying: false, repository: process.env.GITHUB_REPOSITORY,
              sourceSha: process.env.EXPECTED_SOURCE_SHA, runId: process.env.EXPECTED_RUN_ID,
              runAttempt: process.env.EXPECTED_RUN_ATTEMPT, nonce: process.env.EXPECTED_NONCE,
              files: inventory, releaseGatesCleared: []})}\n`, {flag: "wx", mode: 0o600});
          NODE
          accepted="$(node -e 'const fs=require("node:fs");const v=JSON.parse(fs.readFileSync(process.argv[1]));process.stdout.write(String(v.accepted))' "$transport_root/transport-summary.json")"
          printf 'accepted=%s\nretain=true\n' "$accepted" >> "$GITHUB_OUTPUT"

      - name: Upload the bounded nonqualifying MSI lifecycle evidence
        if: always() && steps.bound.outputs.retain == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: post-release-v1.6.1-msi-lifecycle-evidence
          path: |
            ${{ runner.temp }}/myspeed-msi-transport-${{ needs.seal.outputs.nonce }}/msi-host-request.json
            ${{ runner.temp }}/myspeed-msi-transport-${{ needs.seal.outputs.nonce }}/evidence-manifest.json
            ${{ runner.temp }}/myspeed-msi-transport-${{ needs.seal.outputs.nonce }}/msi-lifecycle-result.json
            ${{ runner.temp }}/myspeed-msi-transport-${{ needs.seal.outputs.nonce }}/msi-lifecycle-progress.json
            ${{ runner.temp }}/myspeed-msi-transport-${{ needs.seal.outputs.nonce }}/transport-summary.json
            ${{ runner.temp }}/myspeed-msi-transport-${{ needs.seal.outputs.nonce }}/controller.stdout
            ${{ runner.temp }}/myspeed-msi-transport-${{ needs.seal.outputs.nonce }}/controller.stderr
            ${{ runner.temp }}/myspeed-msi-transport-${{ needs.seal.outputs.nonce }}/msi-execution-closure.json
          if-no-files-found: error
          retention-days: 7

      - name: Require an accepted nonqualifying lifecycle observation
        if: always()
        shell: bash
        run: test "${{ steps.bound.outputs.accepted }}" = 'true'
