      # An accepted sacrificial rollback calibration is a prerequisite the matrix names for the
      # transaction-rollback row, and it is satisfied by the producing run's own retained result
      # document. The SHA-256 of the helper that would perform the calibration is code provenance
      # and proves no execution, so it is not accepted in its place.
      - name: Acquire the accepted rollback calibration evidence
        if: inputs.calibration_mode != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ARTIFACT_ID: ${{ inputs.rollback_artifact_id }}
          TARGET_ARTIFACT_NAME: ${{ env.ROLLBACK_ARTIFACT_NAME }}
          TARGET_WORKFLOW: ${{ env.ROLLBACK_WORKFLOW }}
          OFFICIAL_DIGEST_PATH: ${{ runner.temp }}/myspeed-msi-input-${{ needs.seal.outputs.nonce }}/rollback-official-digest.txt
          PRODUCER_EVENT_SHA_PATH: ${{ runner.temp }}/myspeed-msi-input-${{ needs.seal.outputs.nonce }}/rollback-producer-event-sha.txt
          PRODUCER_RUN_EVENT_PATH: ${{ runner.temp }}/myspeed-msi-input-${{ needs.seal.outputs.nonce }}/rollback-producer-run-event.txt
          TARGET_RUN_ID: ${{ inputs.rollback_run_id }}
          TARGET_RUN_ATTEMPT: ${{ inputs.rollback_run_attempt }}
          TARGET_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          TARGET_ARCHIVE_BYTES: ${{ inputs.rollback_archive_bytes }}
          TARGET_ARCHIVE_SHA256: ${{ inputs.rollback_archive_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/myspeed-msi-input-$EXPECTED_NONCE"
          test -d "$input_root"
          node --input-type=module - "$input_root/rollback-artifact.zip" <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          const target = process.argv[2];
          const exact = (value, pattern, name) => { if (typeof value !== "string" || !pattern.test(value))
            throw new Error(`${name} is invalid`); };
          exact(process.env.TARGET_ARTIFACT_ID, /^[1-9][0-9]{0,19}$/u, "artifact id");
          exact(process.env.TARGET_RUN_ID, /^[1-9][0-9]{0,19}$/u, "run id");
          exact(process.env.TARGET_RUN_ATTEMPT, /^[1-9][0-9]{0,9}$/u, "run attempt");
          exact(process.env.TARGET_SOURCE_SHA, /^[a-f0-9]{40}$/u, "source SHA");
          exact(process.env.TARGET_ARCHIVE_BYTES, /^[1-9][0-9]{0,8}$/u, "archive bytes");
          exact(process.env.TARGET_ARCHIVE_SHA256, /^[a-f0-9]{64}$/u, "archive SHA-256");
          if (Number(process.env.TARGET_ARCHIVE_BYTES) > 67108864)
            throw new Error("archive size bound is invalid");
          const headers = {Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.GH_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28"};
          const abort = new AbortController(); const timeout = setTimeout(() => abort.abort(), 600_000);
          try {
            const metadata = await fetch(
              `https://api.github.com/repos/i7Gamer/MySpeed/actions/artifacts/${process.env.TARGET_ARTIFACT_ID}`,
              {headers, signal: abort.signal});
            if (!metadata.ok) throw new Error("artifact metadata request failed");
            const artifact = await metadata.json();
            if (String(artifact.id) !== process.env.TARGET_ARTIFACT_ID ||
                artifact.name !== process.env.TARGET_ARTIFACT_NAME || artifact.expired !== false ||
                String(artifact.size_in_bytes) !== process.env.TARGET_ARCHIVE_BYTES ||
                String(artifact.workflow_run?.id) !== process.env.TARGET_RUN_ID ||
                artifact.workflow_run?.head_sha !== process.env.TARGET_SOURCE_SHA)
              throw new Error("artifact metadata identity differs");
            /*
             * The pin a dispatch supplies cannot authenticate itself, so the platform's own digest
             * for this artifact is compared with it before a byte is fetched - and the downloaded
             * bytes are then hashed against the same value. Agreeing with the caller is not the same
             * as agreeing with the platform.
             */
            if (typeof artifact.digest !== "string" ||
                artifact.digest !== `sha256:${process.env.TARGET_ARCHIVE_SHA256}`)
              throw new Error("official artifact digest differs from the dispatch pin");
            fs.writeFileSync(process.env.OFFICIAL_DIGEST_PATH, `${artifact.digest}\n`,
              {flag: "wx", mode: 0o600});
            const run = await fetch(
              `https://api.github.com/repos/i7Gamer/MySpeed/actions/runs/${process.env.TARGET_RUN_ID}/attempts/${process.env.TARGET_RUN_ATTEMPT}`,
              {headers, signal: abort.signal});
            if (!run.ok) throw new Error("workflow attempt metadata request failed");
            const runValue = await run.json();
            /*
             * The producing workflow's identity and this attempt are bound as well as the run and the
             * SHA: an artifact of the right id from some other workflow is not this prerequisite.
             */
            if (String(runValue.id) !== process.env.TARGET_RUN_ID ||
                String(runValue.run_attempt) !== process.env.TARGET_RUN_ATTEMPT ||
                runValue.head_sha !== process.env.TARGET_SOURCE_SHA ||
                runValue.repository?.full_name !== "i7Gamer/MySpeed" || runValue.conclusion !== "success" ||
                runValue.path !== `.github/workflows/${process.env.TARGET_WORKFLOW}`)
              throw new Error("workflow attempt identity differs");
            fs.writeFileSync(process.env.PRODUCER_RUN_EVENT_PATH, `${runValue.event}\n`,
              {flag: "wx", mode: 0o600});
            const response = await fetch(artifact.archive_download_url, {headers, signal: abort.signal});
            if (!response.ok || !response.body) throw new Error("artifact archive request failed");
            const handle = fs.openSync(target,
              fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_WRONLY, 0o600);
            const digest = crypto.createHash("sha256"); let total = 0;
            try {
              for await (const part of response.body) { const bytes = Buffer.from(part); total += bytes.length;
                if (total > Number(process.env.TARGET_ARCHIVE_BYTES))
                  throw new Error("artifact archive exceeded its bound");
                digest.update(bytes); let offset = 0;
                while (offset < bytes.length) {
                  const count = fs.writeSync(handle, bytes, offset, bytes.length - offset);
                  if (count < 1) throw new Error("artifact archive write was truncated"); offset += count; } }
              fs.fsyncSync(handle);
            } finally { fs.closeSync(handle); }
