name: Post-release v1.6.1 MSI lifecycle

# Manual, nonqualifying, post-release observation of the already-published v1.6.1 candidate.
# It clears no release gate, publishes nothing, and never mutates the published release, its
# assets, its tag or its original reduced-scope qualification manifest.
#
# One run, one attempt, three jobs with different roles:
#   prepare  - the existing reusable Windows preparation workflow, called in this same run so its
#              artifact carries this run id, attempt and head SHA. Its own dispatch path is
#              untouched.
#   seal     - the only job that checks out source. It tests and seals the exact controller and
#              guest closures.
#   execute  - one Linux job that creates and seals the installed base AND runs every overlay row.
#              The base receipt binds same-job file identity, so the base is never exported,
#              imported or uploaded, and the rows can never be split into a second job. This job
#              performs no checkout: it runs the sealed closure, verified member by member first.
#
# Fourteen rows at the 270-minute row deadline is sixty-three hours and this job stops at 350
# minutes, so the controller admits each row against observed elapsed time and refuses to start one
# whose margins no longer fit. The allowance is a planning figure that nothing enforces - the only
# per-row stop is the launcher's own deadline - and the sealed observation says so. A refused row is
# retained as typed progress and fails the job; it is never reported as a completed matrix.
#
# Stage 2 keeps its own sealed closure and its own staged input root, because its validator names
# both exactly and the MSI closure is a different tree. The KVM subtree the job invokes is a third
# tree the KVM contract pins to its own root, so its digest is sealed as a job output and checked
# before anything in it runs: a tree cannot authenticate itself with a manifest it carries.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN-POST-RELEASE-MSI-LIFECYCLE
        required: true
        type: string
      job_budget_minutes:
        description: Wall minutes the Linux controller may consume, measured from its own start
        required: true
        type: string
      row_allowance_minutes:
        description: Planned minutes per matrix row; a measured figure, never the row deadline
        required: true
        type: string
      probe_artifact_id:
        required: true
        type: string
      probe_run_id:
        required: true
        type: string
      probe_run_attempt:
        required: true
        type: string
      probe_source_sha:
        required: true
        type: string
      probe_archive_bytes:
        required: true
        type: string
      probe_archive_sha256:
        required: true
        type: string
      rollback_artifact_id:
        description: Artifact id of an accepted sacrificial rollback calibration run
        required: false
        type: string
      rollback_run_id:
        required: false
        type: string
      rollback_run_attempt:
        required: false
        type: string
      rollback_source_sha:
        description: Head SHA of the calibration run, which is its source SHA
        required: false
        type: string
      rollback_archive_bytes:
        required: false
        type: string
      rollback_archive_sha256:
        required: false
        type: string
      calibration_mode:
        description: Run bounded Scenario 0 calibration instead of the 14-row matrix
        required: false
        default: 'false'
        type: string

permissions:
  actions: read
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ github.sha }}
  EXPECTED_EVENT_SHA: ${{ github.sha }}
  EXPECTED_RUN_ID: ${{ github.run_id }}
  EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
  PREPARATION_ARTIFACT_NAME: post-release-v1.6.1-msi-appassets
  ROLLBACK_ARTIFACT_NAME: windows-msi-sacrificial-executor-boundary
  ROLLBACK_WORKFLOW: windows-msi-rollback-calibration.yml
  ROW_CLEANUP_MARGIN_MINUTES: '2'
  FINAL_MARGIN_MINUTES: '10'
  # Must equal the execute job's timeout-minutes; the reserve is what bounds and uploads the evidence.
  JOB_TIMEOUT_MINUTES: '350'
  RETENTION_RESERVE_MINUTES: '10'

jobs:
  prepare:
    name: Prepare exact Windows MSI inputs in this run
    if: github.repository == 'i7Gamer/MySpeed' && inputs.confirmation == 'RUN-POST-RELEASE-MSI-LIFECYCLE'
    uses: ./.github/workflows/post-release-msi-prepare.yml
    permissions:
      actions: read
      contents: read

  seal:
    name: Test and seal the exact execution closure
    if: github.repository == 'i7Gamer/MySpeed' && inputs.confirmation == 'RUN-POST-RELEASE-MSI-LIFECYCLE'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      stage2_sha256: ${{ steps.seal.outputs.stage2_sha256 }}
      kvm_sha256: ${{ steps.seal.outputs.kvm_sha256 }}
      nonce: ${{ steps.seal.outputs.nonce }}
      closure_sha256: ${{ steps.seal.outputs.closure_sha256 }}
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up exact runtimes
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies without lifecycle scripts
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run the pure execution-side tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/server/windowsMsiExecutionClosure.test.js \
            tests/server/windowsMsiLifecycleBudget.test.js \
            tests/server/windowsMsiPrerequisiteEvidence.test.js \
            tests/server/windowsMsiStage2Request.test.js \
            tests/server/windowsMsiContainmentPreflight.test.js \
            tests/server/windowsMsiMatrixContract.test.js \
            tests/server/linuxWindowsMsiLifecycleHost.test.js \
            tests/server/postReleaseMsiHostRequest.test.js \
            tests/server/postReleaseMsiHostBridge.test.js \
            tests/server/postReleaseMsiLinuxController.test.js \
            tests/server/windowsMsiScenario0Calibration.test.js \
            tests/server/postReleaseMsiLifecycleWorkflow.test.js

      - name: Seal the exact controller and guest closures
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          artifact_root="$RUNNER_TEMP/myspeed-msi-artifact-$nonce"
          closure_root="$artifact_root/myspeed-msi-closure-$nonce"
          kvm_root="$artifact_root/linux-kvm-capability-closure"
          test ! -e "$artifact_root"
          install -d -m 700 "$artifact_root" "$kvm_root"
          stage2_root="$artifact_root/myspeed-stage2-closure-$nonce"
          install -d -m 700 "$closure_root/scripts/qualification" "$closure_root/scripts/release"
          install -d -m 700 "$stage2_root/scripts/qualification"
          install -m 600 scripts/qualification/linux-kvm-capability.mjs "$kvm_root/"
          install -m 600 scripts/qualification/linux-kvm-privileged-capability.mjs "$kvm_root/"
          node "$kvm_root/linux-kvm-capability.mjs" emit-manifest \
            --source-sha "$EXPECTED_SOURCE_SHA" --event-sha "$EXPECTED_EVENT_SHA" \
            --run-id "$EXPECTED_RUN_ID" --run-attempt "$EXPECTED_RUN_ATTEMPT" --nonce "$nonce" \
            --output "$kvm_root/closure.json"
          node "$kvm_root/linux-kvm-privileged-capability.mjs" emit-manifest \
            --source-sha "$EXPECTED_SOURCE_SHA" --event-sha "$EXPECTED_EVENT_SHA" \
            --run-id "$EXPECTED_RUN_ID" --run-attempt "$EXPECTED_RUN_ATTEMPT" --nonce "$nonce" \
            --core "$kvm_root/linux-kvm-capability.mjs" \
            --core-manifest "$kvm_root/closure.json" --output "$kvm_root/privileged-closure.json"
          node --input-type=module - "$closure_root" "$nonce" "$stage2_root" "$kvm_root" <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const {sealWindowsMsiExecutionClosure, sealWindowsMsiKvmSubtree, WINDOWS_MSI_CONTROLLER_CLOSURE,
            WINDOWS_MSI_GUEST_CLOSURE, WINDOWS_MSI_KVM_SUBTREE_MEMBERS} =
            await import("./scripts/qualification/windows-msi-execution-closure.mjs");
          const {WINDOWS_MSI_STAGE2_CLOSURE} =
            await import("./scripts/qualification/windows-msi-stage2-request.mjs");
          const [closureRoot, nonce, stage2Root, kvmRoot] = process.argv.slice(2);
          const digest = bytes => crypto.createHash("sha256").update(bytes).digest("hex");
          const members = [...new Set([...WINDOWS_MSI_CONTROLLER_CLOSURE, ...WINDOWS_MSI_GUEST_CLOSURE])].sort();
          const observe = name => { const bytes = fs.readFileSync(name);
            fs.writeFileSync(path.join(closureRoot, name), bytes, {flag: "wx", mode: 0o400});
            return {path: name, bytes: String(bytes.length), sha256: digest(bytes)}; };
          const observed = new Map(members.map(name => [name, observe(name)]));
          const manifest = sealWindowsMsiExecutionClosure({
            context: {repository: process.env.GITHUB_REPOSITORY, sourceSha: process.env.EXPECTED_SOURCE_SHA,
              eventSha: process.env.EXPECTED_EVENT_SHA, runId: process.env.EXPECTED_RUN_ID,
              runAttempt: process.env.EXPECTED_RUN_ATTEMPT, nonce},
            controller: WINDOWS_MSI_CONTROLLER_CLOSURE.map(name => observed.get(name)),
            guest: WINDOWS_MSI_GUEST_CLOSURE.map(name => observed.get(name))});
          fs.writeFileSync(path.join(closureRoot, "msi-execution-closure.json"),
            `${JSON.stringify(manifest)}\n`, {flag: "wx", mode: 0o400});
          /*
           * Stage 2's validator names its own root and its own ordered eight, so it gets its own
           * sealed tree. The MSI closure stays exactly as it is.
           */
          const stage2 = WINDOWS_MSI_STAGE2_CLOSURE.map(name => { const bytes = fs.readFileSync(name);
            fs.writeFileSync(path.join(stage2Root, name), bytes, {flag: "wx", mode: 0o400});
            return [name, String(bytes.length), digest(bytes)]; });
          const stage2Sha256 = digest(Buffer.from(JSON.stringify(stage2), "utf8"));
          /*
           * The KVM subtree carries the manifests it would otherwise validate itself against, so its
           * digest leaves through the job output rather than inside the artifact.
           */
          const kvmSealed = sealWindowsMsiKvmSubtree({files: Object.fromEntries(
            WINDOWS_MSI_KVM_SUBTREE_MEMBERS.map(name => [name, fs.readFileSync(path.join(kvmRoot, name))]))});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `nonce=${nonce}\nclosure_sha256=${manifest.sha256}\nstage2_sha256=${stage2Sha256}\n`
            + `kvm_sha256=${kvmSealed.sha256}\n`);
          NODE

      - name: Upload the immutable execution closure
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: post-release-v1.6.1-msi-execution-closure
          path: ${{ runner.temp }}/myspeed-msi-artifact-${{ steps.seal.outputs.nonce }}/
          if-no-files-found: error
          retention-days: 7

  execute:
    name: Seal the installed base and run every overlay row in one job
    needs: [prepare, seal]
    if: github.repository == 'i7Gamer/MySpeed' && inputs.confirmation == 'RUN-POST-RELEASE-MSI-LIFECYCLE'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      EXPECTED_NONCE: ${{ needs.seal.outputs.nonce }}
      MYSPEED_SOURCE_SHA: ${{ github.sha }}
      EXPECTED_CLOSURE_SHA256: ${{ needs.seal.outputs.closure_sha256 }}
      EXPECTED_STAGE2_SHA256: ${{ needs.seal.outputs.stage2_sha256 }}
      EXPECTED_KVM_SHA256: ${{ needs.seal.outputs.kvm_sha256 }}
      JOB_BUDGET_MINUTES: ${{ inputs.job_budget_minutes }}
      ROW_ALLOWANCE_MINUTES: ${{ inputs.row_allowance_minutes }}
      PROBE_ARTIFACT_ID: ${{ inputs.probe_artifact_id }}
      PROBE_RUN_ID: ${{ inputs.probe_run_id }}
      PROBE_RUN_ATTEMPT: ${{ inputs.probe_run_attempt }}
      PROBE_SOURCE_SHA: ${{ inputs.probe_source_sha }}
      PROBE_ARCHIVE_BYTES: ${{ inputs.probe_archive_bytes }}
      PROBE_ARCHIVE_SHA256: ${{ inputs.probe_archive_sha256 }}
      ROLLBACK_ARTIFACT_ID: ${{ inputs.rollback_artifact_id }}
      ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
      ROLLBACK_RUN_ATTEMPT: ${{ inputs.rollback_run_attempt }}
      ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
      ROLLBACK_ARCHIVE_BYTES: ${{ inputs.rollback_archive_bytes }}
      ROLLBACK_ARCHIVE_SHA256: ${{ inputs.rollback_archive_sha256 }}
      CALIBRATION_MODE: ${{ inputs.calibration_mode }}
    steps:
      - name: Record the job start for the measured budget
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/msi-job-start"
          date -u +%s > "$RUNNER_TEMP/msi-job-start"

      - name: Download the same-run execution closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.seal.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}

      - name: Set up exact runtime without source checkout
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      # The sealed tree is trusted only after every declared member is re-hashed here, by a verifier
      # that is workflow text pinned to this run's SHA rather than code from the tree it checks.
      - name: Verify every sealed closure member before executing it
        shell: bash
        run: |
          set -euo pipefail
          closure_root="$RUNNER_TEMP/myspeed-msi-closure-$EXPECTED_NONCE"
          node - "$closure_root" <<'NODE'
          const crypto = require("node:crypto"); const fs = require("node:fs"); const path = require("node:path");
          const root = process.argv[2];
          const digest = bytes => crypto.createHash("sha256").update(bytes).digest("hex");
          const manifest = JSON.parse(fs.readFileSync(path.join(root, "msi-execution-closure.json")));
          if (manifest.kind !== "myspeed-windows-msi-execution-closure" || manifest.qualifying !== false ||
              manifest.sha256 !== process.env.EXPECTED_CLOSURE_SHA256 ||
              manifest.repository !== process.env.GITHUB_REPOSITORY ||
              manifest.sourceSha !== process.env.EXPECTED_SOURCE_SHA ||
              manifest.runId !== process.env.EXPECTED_RUN_ID ||
              manifest.runAttempt !== process.env.EXPECTED_RUN_ATTEMPT ||
              manifest.nonce !== process.env.EXPECTED_NONCE ||
              JSON.stringify(manifest.releaseGatesCleared) !== "[]")
            throw new Error("sealed closure manifest identity differs");
          const declared = new Set();
          for (const group of [manifest.controller, manifest.guest]) {
            if (!group.files.some(file => file.path === group.entry)) throw new Error("closure entry is absent");
            for (const file of group.files) {
              const facts = fs.lstatSync(path.join(root, file.path));
              if (!facts.isFile() || facts.isSymbolicLink()) throw new Error("sealed closure member is not a file");
              const bytes = fs.readFileSync(path.join(root, file.path));
              if (String(bytes.length) !== file.bytes || digest(bytes) !== file.sha256)
                throw new Error(`sealed closure member differs: ${file.path}`);
              declared.add(file.path);
            }
          }
          const walk = directory => fs.readdirSync(path.join(root, directory), {withFileTypes: true})
            .flatMap(entry => entry.isDirectory() ? walk(path.posix.join(directory, entry.name))
              : [path.posix.join(directory, entry.name)]);
          const present = walk("scripts").sort();
          if (JSON.stringify(present) !== JSON.stringify([...declared].sort()))
            throw new Error("sealed closure carries source nobody bound a hash to");
          NODE

      # Before Stage 2, which is the expensive part of this job: a dispatched budget that reaches
      # into the retention reserve is refused now rather than after five hours of calibration.
      - name: Validate the dispatched budget before the expensive setup
        shell: bash
        run: |
          set -euo pipefail
          closure_root="$RUNNER_TEMP/myspeed-msi-closure-$EXPECTED_NONCE"
          node --input-type=module - "$closure_root" <<'NODE'
          import path from "node:path";
          import {pathToFileURL} from "node:url";
          const [closureRoot] = process.argv.slice(2);
          const {admitWindowsMsiLifecycleSetup, validateWindowsMsiLifecycleJobBudget} =
            await import(pathToFileURL(path.join(closureRoot,
              "scripts/qualification/windows-msi-lifecycle-budget.mjs")).href);
          const minutes = (value, name) => { if (!/^[1-9][0-9]{0,3}$/u.test(value ?? ""))
            throw new Error(`${name} is invalid`); return Number(value) * 60_000; };
          const job = validateWindowsMsiLifecycleJobBudget({
            jobBudgetMilliseconds: minutes(process.env.JOB_BUDGET_MINUTES, "job budget"),
            jobTimeoutMilliseconds: minutes(process.env.JOB_TIMEOUT_MINUTES, "job timeout"),
            retentionReserveMilliseconds: minutes(process.env.RETENTION_RESERVE_MINUTES,
              "retention reserve")});
          /* And it has to hold at least one row with its margins even before any setup is charged. */
          admitWindowsMsiLifecycleSetup({job, elapsedMilliseconds: 0, limits: {
            rowAllowanceMilliseconds: minutes(process.env.ROW_ALLOWANCE_MINUTES, "row allowance"),
            rowCleanupMarginMilliseconds: minutes(process.env.ROW_CLEANUP_MARGIN_MINUTES,
              "row cleanup margin"),
            finalMarginMilliseconds: minutes(process.env.FINAL_MARGIN_MINUTES, "final margin")}});
          if (process.env.CALIBRATION_MODE === "true") {
            const maxJobBudgetMinutes = 120;
            const maxExecutionAllowanceMinutes = 45;
            const maxJobBudget = maxJobBudgetMinutes * 60_000;
            const maxExecAllowance = maxExecutionAllowanceMinutes * 60_000;
            if (job.jobBudgetMilliseconds > maxJobBudget)
              throw new Error("scenario0 calibration job budget exceeds ceiling");
            if (minutes(process.env.ROW_ALLOWANCE_MINUTES, "row allowance") > maxExecAllowance)
              throw new Error("scenario0 calibration execution allowance exceeds ceiling");
          } else if (process.env.CALIBRATION_MODE === "false") {
            const maximumRollbackArchiveBytes = 64 * 1024 * 1024;
            const exactPattern = (value, pattern, name) => {
              if (typeof value !== "string" || !pattern.test(value))
                throw new Error(`${name} is invalid`);
            };
            exactPattern(process.env.ROLLBACK_ARTIFACT_ID, /^[1-9][0-9]{0,19}$/u, "rollback artifact id");
            exactPattern(process.env.ROLLBACK_RUN_ID, /^[1-9][0-9]{0,19}$/u, "rollback run id");
            exactPattern(process.env.ROLLBACK_RUN_ATTEMPT, /^[1-9][0-9]{0,9}$/u, "rollback run attempt");
            exactPattern(process.env.ROLLBACK_SOURCE_SHA, /^[a-f0-9]{40}$/u, "rollback source SHA");
            exactPattern(process.env.ROLLBACK_ARCHIVE_BYTES, /^[1-9][0-9]{0,8}$/u, "rollback archive bytes");
            exactPattern(process.env.ROLLBACK_ARCHIVE_SHA256, /^[a-f0-9]{64}$/u, "rollback archive SHA-256");
            if (Number(process.env.ROLLBACK_ARCHIVE_BYTES) > maximumRollbackArchiveBytes)
              throw new Error("rollback archive size bound is invalid");
          } else {
            throw new Error("calibration mode is invalid");
          }
          NODE

      # The KVM contract pins its closure root, so these are duplicate copies of two modules that
      # also live in the verified MSI closure, shipped beside manifests they would otherwise validate
      # themselves against. They are checked against the digest the seal job published as a job
      # output - outside the tree - before a single one of them is executed.
      - name: Verify the invoked KVM subtree against the digest sealed outside it
        shell: bash
        run: |
          set -euo pipefail
          closure_root="$RUNNER_TEMP/myspeed-msi-closure-$EXPECTED_NONCE"
          kvm_root="$RUNNER_TEMP/linux-kvm-capability-closure"
          node --input-type=module - "$closure_root" "$kvm_root" <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import {pathToFileURL} from "node:url";
          const [closureRoot, kvmRoot] = process.argv.slice(2);
          const {verifyWindowsMsiKvmSubtree, WINDOWS_MSI_KVM_SUBTREE_MEMBERS} =
            await import(pathToFileURL(path.join(closureRoot,
              "scripts/qualification/windows-msi-execution-closure.mjs")).href);
          const present = fs.readdirSync(kvmRoot, {withFileTypes: true});
          if (present.some(entry => !entry.isFile()))
            throw new Error("KVM subtree carries something that is not a file");
          verifyWindowsMsiKvmSubtree({expectedSha256: process.env.EXPECTED_KVM_SHA256,
            files: Object.fromEntries(present.map(entry =>
              [entry.name, fs.readFileSync(path.join(kvmRoot, entry.name))]))});
          /* Belt and braces: the two executed modules are byte-identical to the verified MSI copies. */
          for (const name of WINDOWS_MSI_KVM_SUBTREE_MEMBERS.filter(value => value.endsWith(".mjs"))) {
            const sealed = fs.readFileSync(path.join(closureRoot, "scripts/qualification", name));
            if (!sealed.equals(fs.readFileSync(path.join(kvmRoot, name))))
              throw new Error(`KVM subtree copy differs from the sealed member: ${name}`);
          }
          NODE

      - name: Repeat ordinary and reviewed privileged KVM observation
        shell: bash
        run: |
          set -euo pipefail
          kvm_root="$RUNNER_TEMP/linux-kvm-capability-closure"
          work_root="$RUNNER_TEMP/myspeed-kvm-capability-$EXPECTED_NONCE"
          set +e
          node "$kvm_root/linux-kvm-capability.mjs" probe \
            --source-sha "$EXPECTED_SOURCE_SHA" --event-sha "$EXPECTED_EVENT_SHA" \
            --run-id "$EXPECTED_RUN_ID" --run-attempt "$EXPECTED_RUN_ATTEMPT" --nonce "$EXPECTED_NONCE" \
            --closure-root "$kvm_root" --manifest "$kvm_root/closure.json" \
            --result "$work_root/result.json"
          ordinary_exit=$?
          set -e
          test "$ordinary_exit" -eq 0 -o "$ordinary_exit" -eq 1
          node "$kvm_root/linux-kvm-privileged-capability.mjs" retry \
            --source-sha "$EXPECTED_SOURCE_SHA" --event-sha "$EXPECTED_EVENT_SHA" \
            --run-id "$EXPECTED_RUN_ID" --run-attempt "$EXPECTED_RUN_ATTEMPT" --nonce "$EXPECTED_NONCE" \
            --closure-root "$kvm_root" --core-manifest "$kvm_root/closure.json" \
            --manifest "$kvm_root/privileged-closure.json" --ordinary-result "$work_root/result.json" \
            --result "$work_root/privileged-result.json"

      - name: Acquire the exact prior Windows probe artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ARTIFACT_ID: ${{ inputs.probe_artifact_id }}
          TARGET_ARTIFACT_NAME: windows-cpu-readiness-evidence
          TARGET_RUN_ID: ${{ inputs.probe_run_id }}
          TARGET_RUN_ATTEMPT: ${{ inputs.probe_run_attempt }}
          TARGET_SOURCE_SHA: ${{ inputs.probe_source_sha }}
          TARGET_ARCHIVE_BYTES: ${{ inputs.probe_archive_bytes }}
          TARGET_ARCHIVE_SHA256: ${{ inputs.probe_archive_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          # Stage 2's validator names this root; the MSI input root beside it is a different tree
          # holding the MSI-side documents, and neither is ever handed to the other's consumer.
          input_root="$RUNNER_TEMP/myspeed-stage2-input-$EXPECTED_NONCE"
          test ! -e "$input_root"
          install -d -m 700 "$input_root" "$RUNNER_TEMP/myspeed-msi-input-$EXPECTED_NONCE"
          install -m 600 "$RUNNER_TEMP/myspeed-kvm-capability-$EXPECTED_NONCE/result.json" "$input_root/ordinary.json"
          install -m 600 "$RUNNER_TEMP/myspeed-kvm-capability-$EXPECTED_NONCE/privileged-result.json" "$input_root/combined.json"
          node --input-type=module - "$input_root/artifact.zip" <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          const target = process.argv[2];
          const exact = (value, pattern, name) => { if (typeof value !== "string" || !pattern.test(value))
            throw new Error(`${name} is invalid`); };
          exact(process.env.TARGET_ARTIFACT_ID, /^[1-9][0-9]{0,19}$/u, "artifact id");
          exact(process.env.TARGET_RUN_ID, /^[1-9][0-9]{0,19}$/u, "run id");
          exact(process.env.TARGET_RUN_ATTEMPT, /^[1-9][0-9]{0,9}$/u, "run attempt");
          exact(process.env.TARGET_SOURCE_SHA, /^[a-f0-9]{40}$/u, "source SHA");
          exact(process.env.TARGET_ARCHIVE_BYTES, /^[1-9][0-9]{0,8}$/u, "archive bytes");
          exact(process.env.TARGET_ARCHIVE_SHA256, /^[a-f0-9]{64}$/u, "archive SHA-256");
          if (Number(process.env.TARGET_ARCHIVE_BYTES) > 268435456)
            throw new Error("archive size bound is invalid");
          const headers = {Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.GH_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28"};
          const abort = new AbortController(); const timeout = setTimeout(() => abort.abort(), 600_000);
          try {
            const metadata = await fetch(
              `https://api.github.com/repos/i7Gamer/MySpeed/actions/artifacts/${process.env.TARGET_ARTIFACT_ID}`,
              {headers, signal: abort.signal});
            if (!metadata.ok) throw new Error("artifact metadata request failed");
            const artifact = await metadata.json();
            if (String(artifact.id) !== process.env.TARGET_ARTIFACT_ID ||
                artifact.name !== process.env.TARGET_ARTIFACT_NAME || artifact.expired !== false ||
                String(artifact.size_in_bytes) !== process.env.TARGET_ARCHIVE_BYTES ||
                String(artifact.workflow_run?.id) !== process.env.TARGET_RUN_ID ||
                artifact.workflow_run?.head_sha !== process.env.TARGET_SOURCE_SHA)
              throw new Error("artifact metadata identity differs");
            const run = await fetch(
              `https://api.github.com/repos/i7Gamer/MySpeed/actions/runs/${process.env.TARGET_RUN_ID}/attempts/${process.env.TARGET_RUN_ATTEMPT}`,
              {headers, signal: abort.signal});
            if (!run.ok) throw new Error("workflow attempt metadata request failed");
            const runValue = await run.json();
            if (String(runValue.id) !== process.env.TARGET_RUN_ID ||
                String(runValue.run_attempt) !== process.env.TARGET_RUN_ATTEMPT ||
                runValue.head_sha !== process.env.TARGET_SOURCE_SHA ||
                runValue.repository?.full_name !== "i7Gamer/MySpeed" || runValue.conclusion !== "success")
              throw new Error("workflow attempt identity differs");
            const response = await fetch(artifact.archive_download_url, {headers, signal: abort.signal});
            if (!response.ok || !response.body) throw new Error("artifact archive request failed");
            const handle = fs.openSync(target,
              fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_WRONLY, 0o600);
            const digest = crypto.createHash("sha256"); let total = 0;
            try {
              for await (const part of response.body) { const bytes = Buffer.from(part); total += bytes.length;
                if (total > Number(process.env.TARGET_ARCHIVE_BYTES))
