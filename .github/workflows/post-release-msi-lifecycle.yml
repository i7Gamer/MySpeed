              if (selected.has(key)) throw new Error("archive member is duplicated");
              selected.set(key, raw); } }
          if (selected.size !== required.size) throw new Error("archive member set is incomplete");
          fs.writeFileSync(process.argv[3],
            `${[...required].map(name => `${name}\t${selected.get(name)}`).join("\n")}\n`,
            {flag: "wx", mode: 0o600});
