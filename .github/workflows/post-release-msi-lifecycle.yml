              const commitValue = await commit.json();
              if (commitValue.sha !== eventSha || !Array.isArray(commitValue.parents) ||
                  !commitValue.parents.some(parent => parent.sha === process.env.TARGET_SOURCE_SHA))
                throw new Error("producer event commit is not a merge of the producer source commit");
            } else if (eventSha !== process.env.TARGET_SOURCE_SHA) {
              throw new Error("producer event SHA differs from the run the platform reports");
            }
