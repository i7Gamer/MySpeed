          while IFS=$'\t' read -r target member; do
            test ! -e "$input_root/$target"
            (umask 077; ulimit -f 32768; /usr/bin/timeout --signal=KILL 60s \
              /usr/bin/unzip -p "$input_root/artifact.zip" "$member" >"$input_root/$target")
            test -f "$input_root/$target" -a ! -L "$input_root/$target"
            member_bytes="$(stat -c %s -- "$input_root/$target")"
            test "$member_bytes" -gt 0 -a "$member_bytes" -le 16777216
