               * On a pull-request run the producer's event commit is the merge the platform built for
               * it, so it is a real commit whose parents include the head the run reported. This does
               * not on its own single out that run's merge - what does is that the SHA was taken from
               * the producer's own retained documents rather than from anything this dispatch chose.
               */
