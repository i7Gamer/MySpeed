          } finally { clearTimeout(timeout); }
          NODE
          # The producer retains exactly these two files, and both are consumed unreshaped.
          for member in result.json launcher.json; do
            test ! -e "$input_root/rollback-$member"
            (umask 077; ulimit -f 4096; /usr/bin/timeout --signal=KILL 60s \
              /usr/bin/unzip -p "$input_root/rollback-artifact.zip" "$member" \
              >"$input_root/rollback-$member")
            test -f "$input_root/rollback-$member" -a ! -L "$input_root/rollback-$member"
            test "$(stat -c %s -- "$input_root/rollback-$member")" -gt 0
            test "$(stat -c %s -- "$input_root/rollback-$member")" -le 262144
          done
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const inputRoot = path.join(process.env.RUNNER_TEMP,
            `myspeed-msi-input-${process.env.EXPECTED_NONCE}`);
          const read = name => {
            const bytes = fs.readFileSync(path.join(inputRoot, name));
            if (bytes.length < 1 || bytes.length > 262144) throw new Error(`${name} exceeds its bound`);
            return JSON.parse(new TextDecoder("utf-8", {fatal: true}).decode(bytes));
          };
          const sha1 = /^[a-f0-9]{40}$/u;
          const result = read("rollback-result.json");
          const launcher = read("rollback-launcher.json");
          /*
           * The launcher retains the exact argument vector the producer was started with, and the
           * document that vector carried is where the producer's own execution context is written
           * down. Exactly one input document may be named, or it is not clear which one ran.
           */
          if (!Array.isArray(launcher.arguments) ||
              launcher.arguments.filter(value => value === "-InputJson").length !== 1)
            throw new Error("producer launch arguments do not carry exactly one input document");
          const launchedWith = launcher.arguments[launcher.arguments.indexOf("-InputJson") + 1];
          if (typeof launchedWith !== "string" || launchedWith.length > 262144)
            throw new Error("producer launch arguments do not carry exactly one input document");
          const launched = JSON.parse(launchedWith);
          for (const name of ["runId", "runAttempt", "sourceSha", "eventSha", "nonce"])
            if (typeof result[name] !== "string" || result[name] !== launched[name])
              throw new Error("producer documents disagree about the run they belong to");
          /* And that agreed-on run has to be the run whose artifact was just authenticated. */
          if (result.runId !== process.env.TARGET_RUN_ID ||
              result.runAttempt !== process.env.TARGET_RUN_ATTEMPT ||
              result.sourceSha !== process.env.TARGET_SOURCE_SHA)
            throw new Error("producer document does not belong to the authenticated run");
          const eventSha = result.eventSha;
          if (!sha1.test(eventSha)) throw new Error("producer event SHA is invalid");
          const producerEvent = fs.readFileSync(process.env.PRODUCER_RUN_EVENT_PATH, "utf8").trim();
          const headers = {Accept: "application/vnd.github+json",
            Authorization: `Bearer ${process.env.GH_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28"};
          const abort = new AbortController(); const timeout = setTimeout(() => abort.abort(), 120_000);
