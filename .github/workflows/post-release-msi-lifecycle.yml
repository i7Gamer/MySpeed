      # Stage 2 gets its own sealed closure, verified against the seal job's digest, and the request
      # is built by the sealed `windows-msi-stage2-request.mjs` rather than by workflow text - so the
      # document this step produces is the one a pure test feeds to the real Stage 2 validator.
      - name: Build the exact Stage 2 request and calibrate the base image
        id: stage2
        shell: bash
        run: |
          set -euo pipefail
          closure_root="$RUNNER_TEMP/myspeed-msi-closure-$EXPECTED_NONCE"
          stage2_root="$RUNNER_TEMP/myspeed-stage2-closure-$EXPECTED_NONCE"
          input_root="$RUNNER_TEMP/myspeed-stage2-input-$EXPECTED_NONCE"
          transport_root="$RUNNER_TEMP/myspeed-msi-transport-$EXPECTED_NONCE"
          install -d -m 700 "$transport_root"
          node --input-type=module - "$closure_root" "$stage2_root" "$input_root" \
            "$transport_root/stage2-request.json" <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import {pathToFileURL} from "node:url";
          const [closureRoot, stage2Root, inputRoot, output] = process.argv.slice(2);
          const {buildWindowsMsiStage2Request, WINDOWS_MSI_STAGE2_CLOSURE, WINDOWS_MSI_STAGE2_PROBE_ROLES,
            WINDOWS_MSI_STAGE2_ROOTS, INSTALLER_BOOT_CONFIRMATION} = await import(pathToFileURL(path.join(closureRoot,
            "scripts/qualification/windows-msi-stage2-request.mjs")).href);
          const hash = bytes => crypto.createHash("sha256").update(bytes).digest("hex");
          const identity = target => { const bytes = fs.readFileSync(target);
            return {path: target, bytes: bytes.length, sha256: hash(bytes)}; };
          /* The Stage 2 tree is authenticated against the seal job's digest before it is executed. */
          const sealed = WINDOWS_MSI_STAGE2_CLOSURE.map(name => { const bytes =
            fs.readFileSync(path.join(stage2Root, name));
            return [name, String(bytes.length), hash(bytes)]; });
          if (hash(Buffer.from(JSON.stringify(sealed), "utf8")) !== process.env.EXPECTED_STAGE2_SHA256)
            throw new Error("sealed Stage 2 closure differs from the digest sealed beside it");
          const walk = directory => fs.readdirSync(path.join(stage2Root, directory),
            {withFileTypes: true}).flatMap(entry => entry.isDirectory()
              ? walk(path.posix.join(directory, entry.name)) : [path.posix.join(directory, entry.name)]);
          if (JSON.stringify(walk("scripts").sort()) !== JSON.stringify([...WINDOWS_MSI_STAGE2_CLOSURE].sort()))
            throw new Error("sealed Stage 2 closure carries source nobody bound a hash to");
          const evidencePath = path.join(inputRoot, "result.json");
          const evidence = JSON.parse(fs.readFileSync(evidencePath));
          if (evidence.status !== "completed" || evidence.calibrationPassed !== true ||
              evidence.sourceSha !== process.env.PROBE_SOURCE_SHA ||
              String(evidence.runId) !== process.env.PROBE_RUN_ID ||
              String(evidence.runAttempt) !== process.env.PROBE_RUN_ATTEMPT)
            throw new Error("probe evidence differs");
          const files = WINDOWS_MSI_STAGE2_PROBE_ROLES.map(role => {
            const name = role.replaceAll("-", "_") + ".exe";
            const built = evidence.observations.build.filter(value => value.mode === role);
            if (built.length !== 1) throw new Error("probe build role is invalid");
            const executable = built[0].executable; const observed = identity(path.join(inputRoot, name));
            if (!executable || observed.bytes !== executable.bytes || observed.sha256 !== executable.sha256)
              throw new Error("probe executable identity differs");
            return {role, name, bytes: String(observed.bytes), sha256: observed.sha256}; });
          const context = {schemaVersion: 1, repository: process.env.GITHUB_REPOSITORY,
            sourceSha: process.env.EXPECTED_SOURCE_SHA, eventSha: process.env.EXPECTED_EVENT_SHA,
            runId: process.env.EXPECTED_RUN_ID, runAttempt: process.env.EXPECTED_RUN_ATTEMPT,
            nonce: process.env.EXPECTED_NONCE, environment: {GITHUB_ACTIONS: process.env.GITHUB_ACTIONS,
              CI: process.env.CI, RUNNER_OS: process.env.RUNNER_OS, RUNNER_ARCH: process.env.RUNNER_ARCH,
              RUNNER_ENVIRONMENT: process.env.RUNNER_ENVIRONMENT, ImageOS: process.env.ImageOS,
              ImageVersion: process.env.ImageVersion}};
          if (stage2Root !== WINDOWS_MSI_STAGE2_ROOTS.closurePrefix + context.nonce ||
              inputRoot !== WINDOWS_MSI_STAGE2_ROOTS.inputPrefix + context.nonce)
            throw new Error("Stage 2 roots differ from the roots its validator names");
          const request = buildWindowsMsiStage2Request({context, identity,
            bootConfirmation: INSTALLER_BOOT_CONFIRMATION,
            probe: {
            artifactId: process.env.PROBE_ARTIFACT_ID, runId: process.env.PROBE_RUN_ID,
            runAttempt: process.env.PROBE_RUN_ATTEMPT, sourceSha: process.env.PROBE_SOURCE_SHA,
            archiveBytes: process.env.PROBE_ARCHIVE_BYTES,
            archiveSha256: process.env.PROBE_ARCHIVE_SHA256, files}});
          fs.writeFileSync(output, JSON.stringify(request) + "\n", {flag: "wx", mode: 0o600});
          NODE
          node "$stage2_root/scripts/qualification/linux-windows-cpu-floor-stage2-controller.mjs" run \
            --request "$transport_root/stage2-request.json" --result "$transport_root/stage2-result.json"

      - name: Bind the same-run Windows preparation artifact metadata
        id: preparation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CAPTURE_PATH: ${{ runner.temp }}/myspeed-msi-input-${{ needs.seal.outputs.nonce }}/preparation-artifact.json
        with:
          script: |
            const fs = require('node:fs');
            const owner = 'i7Gamer'; const repo = 'MySpeed';
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo,
              run_id: Number(process.env.EXPECTED_RUN_ID), per_page: 100});
            const matches = data.artifacts.filter(artifact =>
              artifact.name === process.env.PREPARATION_ARTIFACT_NAME && artifact.expired === false);
            if (matches.length !== 1) throw new Error('same-run preparation artifact is not unique');
            const artifact = matches[0];
            if (String(artifact.workflow_run?.id) !== process.env.EXPECTED_RUN_ID ||
                artifact.workflow_run?.head_sha !== process.env.EXPECTED_SOURCE_SHA)
              throw new Error('preparation artifact is not from this run');
