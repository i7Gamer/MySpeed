              bytes: String(artifact.size_in_bytes), digest: artifact.digest,
              runId: process.env.EXPECTED_RUN_ID, runAttempt: process.env.EXPECTED_RUN_ATTEMPT,
              headSha: process.env.EXPECTED_SOURCE_SHA};
            fs.writeFileSync(process.env.CAPTURE_PATH, `${JSON.stringify(metadata)}\n`, {flag: 'wx'});
