name: Tests

# Runs on every push and pull request, and is called by the release workflow so
# nothing gets published without the suite having passed first.
on:
  push:
    branches: [development, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: "Unit & integration tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      # bun.lock is the only lockfile in the repository, so bun installs the
      # dependencies even though the suite itself runs under node.
      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned to a version whose test runner expands the glob in the test
      # script, and which ships node:sqlite - the branch of the database shim
      # that the compiled binary does not take but the tests do.
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The client keeps its own dependency tree, and tests/client reaches into
      # it - FormatUtil pulls in i18next. Without this the client tests fail
      # with ERR_MODULE_NOT_FOUND on a machine where nobody has run the client.
      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      # server/migrations/index.js and server/integrations/index.js are
      # generated and gitignored; the server does not import without them.
      - name: Generate sources
        run: |
          bun run generate-migrations
          bun run generate-integrations

      # Before the tests, because it is the cheap tier and it sees what they
      # cannot: the suite reads the client's modules as text rather than
      # evaluating them, so a name that is re-exported and then used - which
      # binds nothing, and throws at render - passes 2300 tests and a build.
      #
      # Errors fail the job; warnings do not. The 28 open warnings are unused
      # variables and deliberately narrowed effect dependencies, each of which
      # wants reading rather than a sweep.
      - name: Lint
        run: npm run lint

      # test:all rather than test: `npm test` is the fast tier for the edit-run
      # loop, and running only that here would publish without the integration
      # suite ever having executed.
      - name: Run tests
        run: npm run test:all

      # Nothing above compiles the client. The suite reads its modules as text -
      # node cannot parse JSX - and lint parses each file alone, so neither sees
      # a build that resolves its imports: a component importing a sibling whose
      # filename differs only in case builds on a case-insensitive filesystem and
      # fails here, and the error it fails with names the service worker rather
      # than the import.
      #
      # Until now the only workflow that built the client was build-binaries, on
      # `release` - so the first run of the thing every user installs happened
      # after the release existed.
      - name: Build the client
        working-directory: client
        run: bun run build
