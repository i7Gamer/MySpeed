name: Build MSI

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_id:
        required: true
        type: string

jobs:
  build-msi:
    name: "Windows MSI Installer"
    runs-on: windows-latest
    steps:
      - name: Download Windows server binary
        uses: actions/download-artifact@v7
        with:
          name: MySpeed-windows-x64.exe
          path: ./installer

      - name: Download WinSW service wrapper
        run: |
          Invoke-WebRequest -Uri "https://github.com/winsw/winsw/releases/download/v3.0.0-alpha.11/WinSW-x64.exe" -OutFile "installer\MySpeedService.exe"

      # The working directory is what decides where MySpeed keeps its database:
      # the server resolves data/ against the current directory, so pointing it at
      # ProgramData is what gets the database out of Program Files. %BASE% (the
      # install directory) stays the source of the executable itself - WinSW
      # resolves a bare executable name against the working directory, so that one
      # has to be spelled out now that the two directories differ.
      - name: Create service configuration
        shell: powershell
        run: |
          $serviceConfig = @"
          <service>
            <id>MySpeed</id>
            <name>MySpeed Speedtest Tracker</name>
            <description>MySpeed Speedtest Tracker Service</description>
            <executable>%BASE%\MySpeed.exe</executable>
            <workingdirectory>%ProgramData%\MySpeed</workingdirectory>
            <logmode>rotate</logmode>
            <logpath>%ProgramData%\MySpeed\logs</logpath>
            <stoptimeout>30 sec</stoptimeout>
            <startmode>Automatic</startmode>
            <onfailure action="restart" delay="10 sec"/>
            <resetfailure>1 hour</resetfailure>
          </service>
          "@
          $serviceConfig | Out-File -FilePath "installer\MySpeedService.xml" -Encoding UTF8

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      - name: Create WiX configuration
        shell: powershell
        run: |
          $wxsContent = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="MySpeed" Language="1033" Version="${{ inputs.version }}.0" Manufacturer="Timo" UpgradeCode="A1B2C3D4-5E6F-7890-ABCD-EF1234567890">
              <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />
          
              <MajorUpgrade DowngradeErrorMessage="A newer version of [ProductName] is already installed." />
              <MediaTemplate EmbedCab="yes" />
          
              <Feature Id="ProductFeature" Title="MySpeed" Level="1">
                <ComponentGroupRef Id="ProductComponents" />
                <ComponentRef Id="DataFolder" />
                <ComponentRef Id="LogsFolderComponent" />
              </Feature>
          
              <Directory Id="TARGETDIR" Name="SourceDir">
                <!-- No client build folder: MySpeed.exe embeds the client, and the
                     server only prefers an on-disk build/ when one sits in its working
                     directory - which is now ProgramData, not the install directory. -->
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLFOLDER" Name="MySpeed" />
                </Directory>

                <!-- The database and the logs are written at runtime, so they do not
                     belong under Program Files - that only works today because the
                     service happens to run as LocalSystem. -->
                <Directory Id="CommonAppDataFolder">
                  <Directory Id="DATAROOTFOLDER" Name="MySpeed">
                    <Directory Id="DATAFOLDER" Name="data" />
                    <Directory Id="LOGSFOLDER" Name="logs" />
                  </Directory>
                </Directory>

                <!-- Nothing installs here. Declared so CostFinalize resolves the paths
                     the migration below reads: ProgramFilesFolder is the 32-bit
                     directory, which is where every release up to 1.1.0 landed. -->
                <Directory Id="System64Folder" />
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="LEGACYINSTALLFOLDER" Name="MySpeed" />
                </Directory>
              </Directory>

              <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
                <Component Id="MySpeedExecutable" Guid="*">
                  <File Id="MySpeedExe" Source="MySpeed.exe" KeyPath="yes" />
                </Component>
                <Component Id="ServiceWrapper" Guid="DD2D201B-6AA1-4604-9CF7-4EC6B9C65432">
                  <File Id="ServiceWrapperExe" Source="MySpeedService.exe" KeyPath="yes" />
                  <File Id="ServiceConfig" Source="MySpeedService.xml" />
                  <ServiceInstall Id="MySpeedService" Name="MySpeed" DisplayName="MySpeed Speedtest Tracker" 
                                 Type="ownProcess" Start="auto" ErrorControl="normal" 
                                 Description="MySpeed Speedtest Tracker Service"
                                 Account="LocalSystem" Interactive="no" />
                  <ServiceControl Id="MySpeedServiceControl" Name="MySpeed" Start="install" Stop="both" Remove="uninstall" Wait="yes" />
                </Component>
              </ComponentGroup>
          
              <!-- New GUIDs: all three components changed directory, and a component
                   GUID identifies a payload at a path, not just a payload. -->
              <Component Id="LogsFolderComponent" Directory="LOGSFOLDER" Guid="B96A8157-F8EC-4475-BB2C-202CC2AFEBE0">
                <CreateFolder />
              </Component>

              <Component Id="DataFolder" Directory="DATAFOLDER" Guid="6A568446-09EC-49A8-873F-220743161D47">
                <CreateFolder />
              </Component>

              <!-- Releases up to 1.1.0 kept the database inside the install directory,
                   which a major upgrade uninstalls out from under it. Copy - never move -
                   the old data across on the first install of the new layout, and never
                   over a database that is already there. Immediate rather than deferred
                   so the directory properties resolve; failures are ignored because a
                   missed copy is recoverable by hand and a blocked upgrade is not. -->
              <CustomAction Id="MigrateLegacyData" Directory="DATAROOTFOLDER" Execute="immediate" Return="ignore"
                            ExeCommand="&quot;[System64Folder]cmd.exe&quot; /c if exist &quot;[LEGACYINSTALLFOLDER]data\storage.db&quot; if not exist &quot;[DATAROOTFOLDER]data\storage.db&quot; xcopy &quot;[LEGACYINSTALLFOLDER]data&quot; &quot;[DATAROOTFOLDER]data&quot; /E /I /Y /Q" />

              <InstallExecuteSequence>
                <Custom Action="MigrateLegacyData" Before="StartServices">NOT Installed</Custom>
              </InstallExecuteSequence>
            </Product>
          </Wix>
          "@
          $wxsContent | Out-File -FilePath "installer\myspeed.wxs" -Encoding UTF8

      - name: Build MSI
        working-directory: installer
        run: |
          candle -arch x64 myspeed.wxs
          light myspeed.wixobj -o MySpeed-installer.msi

      - name: Upload to Release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_NAME: MySpeed-installer.msi
          ASSET_PATH: installer/MySpeed-installer.msi
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID, 10),
              name: process.env.ASSET_NAME,
              data: fs.readFileSync(process.env.ASSET_PATH)
            });
