name: Build MSI

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      windows_stamp:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-msi:
    name: "Windows MSI Installer (${{ matrix.label }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Retain both Windows installer names for existing download links.
          # Bun 1.4.2 gives both x64 targets the same Nehalem/SSE4.2 floor
          # with runtime AVX dispatch, so baseline is a compatibility alias.
          - label: x64
            artifact: MySpeed-windows-x64.exe
            product_name: MySpeed
            asset_name: MySpeed-installer.msi
          - label: x64-baseline
            artifact: MySpeed-windows-x64-baseline.exe
            product_name: MySpeed (baseline alias)
            asset_name: MySpeed-installer-baseline.msi

    steps:
      # Both artifacts carry a MySpeed.exe, so everything below - the WiX
      # source, the service configuration, every GUID - is identical either way.
      - name: Download Windows server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: ./installer

      - name: Verify qualified binary input
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
          MSI_MAX_MAJOR: 255
          MSI_MAX_MINOR: 255
          MSI_MAX_BUILD: 65535
        run: |
          if ($env:SOURCE_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Invalid qualification source SHA' }
          if ($env:VERSION -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw 'Invalid qualification version' }
          if ($env:WINDOWS_STAMP -notmatch '^\d+\.\d+\.\d+\.\d+$' -or
              ($env:WINDOWS_STAMP.Split('.')[0..2] -join '.') -ne $env:VERSION) {
            throw 'Invalid frozen Windows build stamp'
          }
          $parts = $env:VERSION.Split('.')
          $limits = @([int]$env:MSI_MAX_MAJOR, [int]$env:MSI_MAX_MINOR, [int]$env:MSI_MAX_BUILD)
          for ($index = 0; $index -lt $parts.Count; $index++) {
            if ([System.Numerics.BigInteger]::Parse($parts[$index]) -gt $limits[$index]) {
              throw 'Qualification version exceeds MSI bounds'
            }
          }
          $binary = 'installer/MySpeed.exe'
          $expected = (Get-Content -LiteralPath "$binary.sha256" -Raw).Trim()
          $actual = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -notmatch '^[a-f0-9]{64}$' -or $actual -ne $expected) {
            throw 'Qualified Windows binary SHA256 mismatch'
          }
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Resolve-Path -LiteralPath $binary).Path
          )
          if ($versionInfo.FileVersion -ne $env:WINDOWS_STAMP -or
              $versionInfo.ProductVersion -ne $env:WINDOWS_STAMP) {
            throw "Qualified executable version does not match frozen stamp $($env:WINDOWS_STAMP)"
          }

      # The wrapper this MSI installs as a LocalSystem service, so what it is
      # matters as much as the binary beside it. Pinned by digest: dependabot
      # watches `uses:` lines and Dockerfile bases and sees nothing at all in a
      # URL inside a run block, so nothing but this check would notice the file
      # at that address changing under a tag that is still an alpha.
      #
      # Verified against the published asset on 2026-09-03.
      - name: Download WinSW service wrapper
        env:
          WINSW_URL: "https://github.com/winsw/winsw/releases/download/v3.0.0-alpha.11/WinSW-x64.exe"
          WINSW_SHA256: "a2daa6a33a9c2b791ae31d9092e7935c339d1e03e89bfb747618ce2f4e819e20"
        run: |
          Invoke-WebRequest -Uri $env:WINSW_URL -OutFile "installer\MySpeedService.exe"

          $actual = (Get-FileHash "installer\MySpeedService.exe" -Algorithm SHA256).Hash.ToLower()

          if ($actual -ne $env:WINSW_SHA256) {
            Write-Error "WinSW does not match its pinned digest: expected $($env:WINSW_SHA256), got $actual"
            exit 1
          }

          Write-Host "WinSW verified: $actual"

      # The working directory is what decides where MySpeed keeps its database:
      # the server resolves data/ against the current directory, so pointing it at
      # ProgramData is what gets the database out of Program Files. %BASE% (the
      # install directory) stays the source of the executable itself - WinSW
      # resolves a bare executable name against the working directory, so that one
      # has to be spelled out now that the two directories differ.
      - name: Create service configuration
        shell: powershell
        run: |
          $serviceConfig = @"
          <service>
            <id>MySpeed</id>
            <name>MySpeed Speedtest Tracker</name>
            <description>MySpeed Speedtest Tracker Service</description>
            <executable>%BASE%\MySpeed.exe</executable>
            <workingdirectory>%ProgramData%\MySpeed</workingdirectory>
            <logmode>rotate</logmode>
            <logpath>%ProgramData%\MySpeed\logs</logpath>
            <stoptimeout>30 sec</stoptimeout>
            <startmode>Automatic</startmode>
            <!-- No onfailure or resetfailure here: WinSW applies those during its
                 own install verb, which the MSI never runs. The recovery lives on
                 the ServiceInstall in the WiX source below, where the service is
                 actually registered. -->
          </service>
          "@
          $serviceConfig | Out-File -FilePath "installer\MySpeedService.xml" -Encoding UTF8

      # A runner-installed toolset is mutable state: the old step asked
      # Chocolatey for 3.11.2, accepted a refused downgrade, then selected the
      # highest preinstalled WiX directory. Download the official portable
      # archive instead, verify its immutable bytes before extraction, and pass
      # absolute tool paths to the build rather than trusting PATH.
      - name: Download pinned portable WiX Toolset
        shell: pwsh
        env:
          WIX_VERSION: "3.14.1"
          WIX_URL: "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          WIX_SHA256: "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31"
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "wix-$($env:WIX_VERSION)-binaries.zip"
          $directory = Join-Path $env:RUNNER_TEMP "wix-$($env:WIX_VERSION)"
          Invoke-WebRequest -Uri $env:WIX_URL -OutFile $archive

          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:WIX_SHA256) {
            throw "WiX archive digest mismatch: expected $($env:WIX_SHA256), got $actual"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $candle = Join-Path $directory "candle.exe"
          $light = Join-Path $directory "light.exe"
          foreach ($tool in @($candle, $light)) {
            if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) {
              throw "Portable WiX archive is missing $tool"
            }
          }

          $candleSha256 = (Get-FileHash -LiteralPath $candle -Algorithm SHA256).Hash.ToLowerInvariant()
          $lightSha256 = (Get-FileHash -LiteralPath $light -Algorithm SHA256).Hash.ToLowerInvariant()
          "WIX_CANDLE=$candle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_LIGHT=$light" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_ARCHIVE_VERSION=$($env:WIX_VERSION)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_ARCHIVE_URL=$($env:WIX_URL)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_ARCHIVE_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Portable candle verified: $candleSha256"
          Write-Host "Portable light verified: $lightSha256"

      # Through env like the rest of the chain, so no workflow expression is
      # substituted into a script body. Both values arrive already checked -
      # create-release refuses a version that is not three numbers, and
      # product_name is the matrix's own - but the rule is uniform so that
      # staying safe does not depend on remembering which were checked upstream.
      - name: Create WiX configuration
        shell: powershell
        env:
          PRODUCT_NAME: ${{ matrix.product_name }}
          VERSION: ${{ inputs.version }}
        run: |
          $wxsContent = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi" xmlns:util="http://schemas.microsoft.com/wix/UtilExtension">
            <Product Id="*" Name="$($env:PRODUCT_NAME)" Language="1033" Version="$($env:VERSION).0" Manufacturer="i7Gamer" UpgradeCode="A1B2C3D4-5E6F-7890-ABCD-EF1234567890">
              <!-- 500, not 200: the MsiLockPermissionsEx table the ProgramData
                   folders below are secured through is read by Windows Installer
                   5.0 and ignored by anything older, which would leave the
                   inherited ACL standing with nothing said. 5.0 shipped with
                   Windows 7, and the binary needs Windows 10 anyway. -->
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" />
          
              <!-- The two installers share this product's UpgradeCode on purpose:
                   they are one product carrying a different binary, and separate
                   codes would let both install at once, each registering a service
                   named MySpeed against one ProgramData directory.

                   AllowSameVersionUpgrades is the other half of that. The person
                   this second installer exists for installed the wrong one, watched
                   the service never start, and now installs the other at the same
                   version - which the default refuses to treat as an upgrade,
                   leaving two entries in Add/Remove Programs instead of a working
                   service. ProgramData is untouched by the swap, and MigrateLegacyData
                   below already refuses to copy over a database that is there, so
                   the existing data survives it.

                   Schedule removal after InstallInitialize so it is inside the
                   Windows Installer transaction. The earlier default removes the
                   predecessor before rollback begins, so a later failure leaves
                   neither version installed instead of restoring the old one. -->
              <MajorUpgrade AllowSameVersionUpgrades="yes" Schedule="afterInstallInitialize"
                            DowngradeErrorMessage="A newer version of [ProductName] is already installed." />
              <MediaTemplate EmbedCab="yes" />

              <!-- Add/Remove Programs reads these; the UAC prompt reads none of
                   them. That prompt says "Unknown publisher" because the MSI
                   carries no Authenticode signature, and nothing but a signature
                   changes it. What these reach is the installed entry, which
                   until now credited a bare given name with no link to the
                   project standing behind it. -->
              <Property Id="ARPURLINFOABOUT" Value="https://github.com/i7Gamer/MySpeed" />
              <Property Id="ARPHELPLINK" Value="https://github.com/i7Gamer/MySpeed/issues" />
              <Property Id="ARPURLUPDATEINFO" Value="https://github.com/i7Gamer/MySpeed/releases" />
          
              <Feature Id="ProductFeature" Title="MySpeed" Level="1">
                <ComponentGroupRef Id="ProductComponents" />
                <ComponentRef Id="DataRootFolder" />
                <ComponentRef Id="DataFolder" />
                <ComponentRef Id="LogsFolderComponent" />
              </Feature>
          
              <Directory Id="TARGETDIR" Name="SourceDir">
                <!-- No client build folder: MySpeed.exe embeds the client, and the
                     server only prefers an on-disk build/ when one sits in its working
                     directory - which is now ProgramData, not the install directory. -->
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLFOLDER" Name="MySpeed" />
                </Directory>

                <!-- The database and the logs are written at runtime, so they do not
                     belong under Program Files - that only works today because the
                     service happens to run as LocalSystem. -->
                <Directory Id="CommonAppDataFolder">
                  <Directory Id="DATAROOTFOLDER" Name="MySpeed">
                    <Directory Id="DATAFOLDER" Name="data" />
                    <Directory Id="LOGSFOLDER" Name="logs" />
                  </Directory>
                </Directory>

                <!-- Nothing installs here. Declared so CostFinalize resolves the paths
                     the migration below reads: ProgramFilesFolder is the 32-bit
                     directory, which is where every release up to 1.1.0 landed. -->
                <Directory Id="System64Folder" />
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="LEGACYINSTALLFOLDER" Name="MySpeed" />
                </Directory>
              </Directory>

              <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
                <Component Id="MySpeedExecutable" Guid="*">
                  <File Id="MySpeedExe" Source="MySpeed.exe" KeyPath="yes" />
                </Component>
                <Component Id="ServiceWrapper" Guid="DD2D201B-6AA1-4604-9CF7-4EC6B9C65432">
                  <File Id="ServiceWrapperExe" Source="MySpeedService.exe" KeyPath="yes" />
                  <File Id="ServiceConfig" Source="MySpeedService.xml" />
                  <ServiceInstall Id="MySpeedService" Name="MySpeed" DisplayName="MySpeed Speedtest Tracker"
                                 Type="ownProcess" Start="auto" ErrorControl="normal"
                                 Description="MySpeed Speedtest Tracker Service"
                                 Account="LocalSystem" Interactive="no">
                    <!-- Restart after a crash, the way the Linux unit's Restart=always
                         does. Stated here because this element is what registers the
                         service: the WinSW config's onfailure only takes effect through
                         WinSW's own install verb, which the MSI never runs, so an
                         installed MySpeed carried no failure actions at all and a crash
                         left it stopped until a reboot. -->
                    <util:ServiceConfig FirstFailureActionType="restart" SecondFailureActionType="restart"
                                        ThirdFailureActionType="restart" RestartServiceDelayInSeconds="10"
                                        ResetPeriodInDays="1" />
                  </ServiceInstall>
                  <ServiceControl Id="MySpeedServiceControl" Name="MySpeed" Start="install" Stop="both" Remove="uninstall" Wait="yes" />
                </Component>
              </ComponentGroup>
          
              <!-- New GUIDs: all three components changed directory, and a component
                   GUID identifies a payload at a path, not just a payload. -->
              <Component Id="LogsFolderComponent" Directory="LOGSFOLDER" Guid="B96A8157-F8EC-4475-BB2C-202CC2AFEBE0">
                <CreateFolder />
              </Component>

              <!-- Who may read the data directory. ProgramData grants BUILTIN\Users
                   read access and every folder created beneath it inherits that,
                   so the database holding the password hash and every integration
                   secret, the TLS key under certs, and the .env beside them were
                   readable by any account that could log on. The server cannot
                   repair this itself: createFolders.js sets POSIX modes, which
                   node ignores on win32, and the directory exists before the
                   service ever starts.

                   The SDDL is a protected DACL - the P is what stops the
                   inheritance - granting full control to the service's own
                   account (SY, LocalSystem, which the ServiceInstall above names)
                   and to administrators (BA), both inherited by everything created
                   underneath, and to nobody else. SIDs rather than names, so a
                   localised Windows whose group is called Administratoren resolves
                   it the same. The core PermissionEx, not the util extension's:
                   that one only adds entries to the DACL the folder already has,
                   so the inherited grant would have survived it untouched.

                   The root gets it as well as data, and logs inherits from the
                   root: .env lives in the root, and the migration's xcopy below
                   lets copied files inherit the destination, so a database
                   carried over from an old install comes out tightened too. -->
              <Component Id="DataRootFolder" Directory="DATAROOTFOLDER" Guid="FE250AC5-C29B-42AE-B373-F8B28BBA2E5B">
                <CreateFolder>
                  <PermissionEx Sddl="D:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)" />
                </CreateFolder>
              </Component>

              <Component Id="DataFolder" Directory="DATAFOLDER" Guid="6A568446-09EC-49A8-873F-220743161D47">
                <CreateFolder>
                  <PermissionEx Sddl="D:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)" />
                </CreateFolder>
              </Component>

              <!-- Releases up to 1.1.0 kept the database inside the install directory,
                   which a major upgrade uninstalls out from under it. Copy - never move -
                   the old data across on the first install of the new layout, and never
                   over a database that is already there. Immediate rather than deferred
                   so the directory properties resolve; failures are ignored because a
                   missed copy is recoverable by hand and a blocked upgrade is not. -->
              <CustomAction Id="MigrateLegacyData" Directory="DATAROOTFOLDER" Execute="immediate" Return="ignore"
                            ExeCommand="&quot;[System64Folder]cmd.exe&quot; /c if exist &quot;[LEGACYINSTALLFOLDER]data\storage.db&quot; if not exist &quot;[DATAROOTFOLDER]data\storage.db&quot; xcopy &quot;[LEGACYINSTALLFOLDER]data&quot; &quot;[DATAROOTFOLDER]data&quot; /E /I /Y /Q" />

              <InstallExecuteSequence>
                <Custom Action="MigrateLegacyData" Before="StartServices">NOT Installed</Custom>
              </InstallExecuteSequence>
            </Product>
          </Wix>
          "@
          $wxsContent | Out-File -FilePath "installer\myspeed.wxs" -Encoding UTF8

      # ICE61 fires on AllowSameVersionUpgrades because the upgrade table then
      # covers the current version too. That is the intent, and it is only a
      # warning, but silencing it keeps a real one visible in the log.
      - name: Build MSI
        working-directory: installer
        shell: pwsh
        run: |
          & $env:WIX_CANDLE -arch x64 -ext WixUtilExtension myspeed.wxs
          if ($LASTEXITCODE -ne 0) { throw 'WiX compiler failed' }
          & $env:WIX_LIGHT myspeed.wixobj -ext WixUtilExtension -sice:ICE61 -v -o MySpeed-installer.msi 2>&1 |
            Tee-Object -FilePath ice-validation.log
          if ($LASTEXITCODE -ne 0) { throw 'WiX linker or ICE validation failed' }

      - name: Hash installer
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
        run: |
          foreach ($path in @('installer/MySpeed-installer.msi', 'installer/ice-validation.log')) {
            (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() |
              Set-Content -LiteralPath "$path.sha256" -Encoding ascii
          }
          $provenance = [ordered]@{
            sourceSha = $env:SOURCE_SHA
            version = $env:VERSION
            windowsStamp = $env:WINDOWS_STAMP
            wixArchiveVersion = $env:WIX_ARCHIVE_VERSION
            wixArchiveUrl = $env:WIX_ARCHIVE_URL
            wixArchiveSha256 = $env:WIX_ARCHIVE_SHA256
            wixCandleVersion = (Get-Item -LiteralPath $env:WIX_CANDLE).VersionInfo.FileVersion
            wixCandleSha256 = (Get-FileHash -LiteralPath $env:WIX_CANDLE -Algorithm SHA256).Hash.ToLowerInvariant()
            wixLightVersion = (Get-Item -LiteralPath $env:WIX_LIGHT).VersionInfo.FileVersion
            wixLightSha256 = (Get-FileHash -LiteralPath $env:WIX_LIGHT -Algorithm SHA256).Hash.ToLowerInvariant()
            binarySha256 = (Get-FileHash -LiteralPath 'installer/MySpeed.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
            installerSha256 = (Get-FileHash -LiteralPath 'installer/MySpeed-installer.msi' -Algorithm SHA256).Hash.ToLowerInvariant()
            iceSha256 = (Get-FileHash -LiteralPath 'installer/ice-validation.log' -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $provenance | ConvertTo-Json | Set-Content -LiteralPath 'installer/msi-build-provenance.json' -Encoding utf8
          (Get-FileHash -LiteralPath 'installer/msi-build-provenance.json' -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath 'installer/msi-build-provenance.json.sha256' -Encoding ascii

      - name: Upload verified installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-msi-${{ matrix.asset_name }}
          path: |
            installer/MySpeed-installer.msi
            installer/MySpeed-installer.msi.sha256
            installer/ice-validation.log
            installer/ice-validation.log.sha256
            installer/msi-build-provenance.json
            installer/msi-build-provenance.json.sha256
          if-no-files-found: error
