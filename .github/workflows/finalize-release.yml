name: Finalize qualified release

on:
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string
      qualification_run_id:
        required: true
        type: string
      qualification_run_attempt:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      windows_stamp:
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    name: Publish draft after every promotion gate
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download sealed qualification manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}
          name: release-qualification-manifest
          path: ${{ runner.temp }}/qualification

      - name: Revalidate promotion immediately before mutation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MANIFEST: ${{ runner.temp }}/qualification/qualification-manifest.json
          RUN_ID: ${{ inputs.qualification_run_id }}
          RUN_ATTEMPT: ${{ inputs.qualification_run_attempt }}
          SOURCE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
          WINDOWS_STAMP: ${{ inputs.windows_stamp }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const fs = require('fs'); const {createHash} = require('crypto');
            const maxAgeMs = 7 * 24 * 60 * 60 * 1000; const maxManifestBytes = 10 * 1024 * 1024;
            const bytes = fs.readFileSync(process.env.MANIFEST); const stat = fs.lstatSync(process.env.MANIFEST);
            if (!stat.isFile() || stat.nlink !== 1 || stat.size === 0 || stat.size > maxManifestBytes) throw new Error('Unsafe qualification manifest');
            const sealed = fs.readFileSync(process.env.MANIFEST + '.sha256', 'utf8').trim();
            if (!/^[a-f0-9]{64}$/.test(sealed) || createHash('sha256').update(bytes).digest('hex') !== sealed) throw new Error('Qualification manifest seal mismatch');
            const manifest = JSON.parse(bytes); const runId = Number(process.env.RUN_ID); const attempt = Number(process.env.RUN_ATTEMPT);
            const approvedVersions = ['1.6.1', '1.7.0'];
            const approvedScope = 'owner-approved-reduced-v' + manifest.source.version;
            const deferredChecks = ['Windows native full verification with enforced outbound denial',
              'Windows native CPU-floor verification', 'Disposable Windows MSI lifecycle acceptance'];
            if (context.repo.owner + '/' + context.repo.repo !== 'i7Gamer/MySpeed'
              || manifest.source.repository !== 'i7Gamer/MySpeed' || !approvedVersions.includes(manifest.source.version)
              || manifest.promotion.scope?.id !== approvedScope
              || JSON.stringify(manifest.promotion.scope.deferredChecks) !== JSON.stringify(deferredChecks)
              || manifest.promotion.evidence?.windowsNative !== null
              || manifest.promotion.evidence?.windowsCpuFloor !== null
              || manifest.promotion.evidence?.msiLifecycle !== null)
              throw new Error('Qualification scope is not an approved release-specific reduced policy');
            if (manifest.run.id !== runId || manifest.run.attempt !== attempt || manifest.source.sha !== process.env.SOURCE_SHA
              || manifest.source.version !== process.env.VERSION || manifest.source.windowsStamp !== process.env.WINDOWS_STAMP
              || manifest.promotion.eligible !== true || manifest.promotion.blockers?.length !== 0) throw new Error('Qualification is not promotion eligible');
            const {data: run} = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: runId});
            const {data: branch} = await github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: process.env.DEFAULT_BRANCH});
            const createdAt = Date.parse(run.created_at);
            if (context.ref !== 'refs/heads/' + process.env.DEFAULT_BRANCH || branch.commit.sha !== process.env.SOURCE_SHA
              || run.run_attempt !== attempt || run.event !== 'workflow_dispatch' || run.conclusion !== 'success'
              || run.path !== '.github/workflows/qualify-release.yml' || run.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo
              || run.head_sha !== process.env.SOURCE_SHA || run.head_branch !== process.env.DEFAULT_BRANCH
              || !Number.isFinite(createdAt) || Date.now() - createdAt > maxAgeMs) throw new Error('Qualification is stale or untrusted');

      - name: Generate notes and publish the existing draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
        with:
          script: |
            if (!/^\d+\.\d+\.\d+$/.test(process.env.VERSION)) throw new Error('Invalid release version');
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) throw new Error('Invalid release ID');
            const tag = 'v' + process.env.VERSION;
            const {data: release} = await github.rest.repos.getRelease({owner: context.repo.owner,
              repo: context.repo.repo, release_id: releaseId});
            if (!release.draft || release.tag_name !== tag) throw new Error('Release draft identity mismatch');
            const {data: tagRef} = await github.rest.git.getRef({owner: context.repo.owner,
              repo: context.repo.repo, ref: 'tags/' + tag});
            if (tagRef.object.type !== 'commit' || tagRef.object.sha !== process.env.SOURCE_SHA)
              throw new Error('Release tag no longer points to the qualified candidate');
            const {data: generated} = await github.rest.repos.generateReleaseNotes({owner: context.repo.owner,
              repo: context.repo.repo, tag_name: tag, target_commitish: release.target_commitish});
            const base = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/releases/download/' + tag + '/';
            const link = (label, file) => '[' + label + '](' + base + file + ')';
            const downloads = [
              '## Downloads',
              '',
              '| Platform | x86-64 | ARM64 |',
              '| :-- | :-- | :-- |',
              '| **Windows** | ' + link('EXE', 'MySpeed-windows-x64.exe') + ' · '
                + link('MSI', 'MySpeed-installer.msi') + ' · '
                + link('EXE (no AVX2)', 'MySpeed-windows-x64-baseline.exe') + ' · '
                + link('MSI (no AVX2)', 'MySpeed-installer-baseline.msi') + ' | — |',
              '| **Linux** | ' + link('Binary', 'MySpeed-linux-x64') + ' · '
                + link('No AVX2', 'MySpeed-linux-x64-baseline') + ' | '
                + link('Binary', 'MySpeed-linux-arm64') + ' |',
              '| **macOS** | ' + link('Binary', 'MySpeed-macos-x64') + ' | '
                + link('Binary', 'MySpeed-macos-arm64') + ' |',
              '',
              'The baseline filenames are retained compatibility aliases; they do not identify a separate CPU target. AVX-disabled Windows execution remains unverified.',
              '',
              '### Source Distribution',
              '',
              '- ' + link('ZIP Archive', 'MySpeed.zip') + ' (requires Bun 1.4.2 or newer)',
              '',
              '### Docker Images',
              '',
              '- `i7gamer/myspeed:latest`',
              '- `i7gamer/myspeed:' + process.env.VERSION + '`',
              '',
              '### Installation Scripts',
              '',
              '- ' + link('Linux installer', 'install.sh') + ' · '
                + link('Docker installer', 'docker-install.sh') + ' · '
                + link('Installer chooser', 'chooser.sh'),
              '',
              '### Checksums and Qualification',
              '',
              '- ' + link('SHA-256 checksums', 'SHA256SUMS') + ' · '
                + link('Qualification manifest', 'qualification-manifest.json') + ' · '
                + link('Manifest SHA-256', 'qualification-manifest.json.sha256')
            ].join('\n');
            const compatibility = '## Runtime compatibility\n\nSource installs require Bun 1.4.2 or newer, or Node.js 22.19.0 or newer for development and tests. The x64 compiler target is Nehalem/SSE4.2 with runtime AVX dispatch; the baseline filenames are compatibility aliases. The Windows CPU floor has not been verified on AVX-disabled hardware.';
            const qualification = '## Qualification scope and limitations\n\n' + tag
              + ' uses the owner-approved-reduced-' + tag + ' qualification scope. Linux, macOS, source-runtime and Docker checks passed. Windows binaries passed listener-free reset and version checks; installers passed build/provenance checks and WiX ICE validation. Windows native HTTP/service runtime with enforced outbound denial is not verified. AVX-disabled Windows CPU-floor execution is not verified. The complete Windows MSI install/upgrade/rollback/uninstall lifecycle is not verified. These checks are deferred, not passed; see the qualification manifest for the exact evidence and artifact digests.';
            const body = compatibility + '\n\n' + qualification + '\n\n---\n\n' + downloads
              + '\n\n---\n\n' + generated.body;
            await github.rest.repos.updateRelease({owner: context.repo.owner, repo: context.repo.repo,
              release_id: releaseId, name: tag, body, draft: false, prerelease: false});
