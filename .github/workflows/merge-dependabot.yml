name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The suite has to pass before anything merges.
  #
  # This is a job dependency rather than a required status check because the two
  # cannot coexist here: a required check on `development` also rejects direct
  # pushes, which is how create_release.yml lands its version bump, and the
  # GitHub Actions bypass actor that would exempt it is only available to
  # organisation-owned repositories.
  test:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'i7Gamer/MySpeed' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test.yml
    with:
      dependabot-call: true

  merge:
    name: "Auto-merge"
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Majors carry breaking changes that the suite cannot see - the action
      # bumps in this repository have needed their changelogs read by hand - so
      # they wait for a person.
      # Base-image bumps wait too, whatever their size: nothing on a pull
      # request builds the Dockerfile - test.yml never reads it, and
      # build-docker.yml only runs from a release - so the first build of a
      # new tag would be the release's own, the one job whose failure tears
      # down a tag and a draft.
      - name: Merge the tested revision
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.metadata.outputs.package-ecosystem != 'docker'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const pull = {...context.repo, pull_number: Number(process.env.PR_NUMBER)};
            const sha = process.env.TESTED_HEAD;
            const {data: current} = await github.rest.pulls.get(pull);
            if (current.merged) {
              core.info('This pull request is already merged.');
              return;
            }
            if (current.head.sha !== sha) {
              core.info('This test run was superseded by a newer pull request head.');
              return;
            }
            // The API checks sha atomically at merge time, including a head
            // change after the read above. A race or API failure fails this job.
            const {data: result} = await github.rest.pulls.merge({...pull, sha, merge_method: 'merge'});
            if (!result.merged) throw new Error('GitHub refused to merge the tested revision.');

      - name: Flag the major update for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Tests pass, but this is a **major** version update, so it has not been auto-merged. Read the changelog for breaking changes before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag the base-image update for review
        if: steps.metadata.outputs.package-ecosystem == 'docker' && steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Tests pass, but nothing here builds the Dockerfile, so this base-image update has not been auto-merged. Build the image once (\`docker build .\`) before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
